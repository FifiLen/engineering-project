name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typy, testy, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Ta sama wersja PostGIS co w infra/docker-compose.yml (ADR 0010).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: hulajnogi
          POSTGRES_PASSWORD: hulajnogi
          POSTGRES_DB: hulajnogi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hulajnogi -d hulajnogi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Bez DATABASE_URL testy bazy i API są pomijane, więc w CI ustawiamy ją zawsze.
      DATABASE_URL: postgres://hulajnogi:hulajnogi@localhost:5432/hulajnogi
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      # Wersja pnpm z pola packageManager w package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typy
        run: pnpm typecheck

      - name: Migracje na czystej bazie
        run: pnpm db:migrate

      - name: Testy
        run: pnpm test

      - name: Build
        run: pnpm build
