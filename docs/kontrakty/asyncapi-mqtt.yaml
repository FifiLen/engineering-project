asyncapi: 3.0.0
info:
  title: Komunikacja z hulajnogami (MQTT)
  version: 1.1.0
  description: |
    Kontrakt między hulajnogą (lub symulatorem) a backendem systemu wypożyczania.
    Operacje są opisane z perspektywy hulajnogi: hulajnoga wysyła telemetrię,
    status i potwierdzenia, a odbiera komendy.

    Zasady:
    * QoS 1 dla wszystkich wiadomości.
    * Hulajnoga przy połączeniu ustawia Last Will na kanale status z treścią
      {"online": false} i flagą retained.
    * Każda komenda ma commandId; hulajnoga odpowiada potwierdzeniem z tym samym
      identyfikatorem. Powtórzona komenda o znanym commandId nie jest wykonywana
      ponownie, tylko ponownie potwierdzana.
    * Po odzyskaniu łączności hulajnoga dosyła zbuforowaną telemetrię
      z oryginalnymi znacznikami czasu.
    * Komenda z polem expiresAt po tym czasie nie jest wykonywana; hulajnoga
      odpowiada ok = false z powodem EXPIRED. Dotyczy też komendy, którą broker
      dostarczył z sesji trwałej po powrocie hulajnogi online (ADR 0038).

    Zmiany:
    * 1.1.0 (2026-11-16): opcjonalne pole expiresAt w komendzie i powód
      odrzucenia EXPIRED (ADR 0038). Zgodne wstecz: komenda bez expiresAt
      nie wygasa, a urządzenie z kontraktem 1.0.0 pole pomija.
    * 1.0.0 (2026-11-09): pierwsza wersja.

servers:
  lokalny:
    host: localhost:1883
    protocol: mqtt
    description: Mosquitto w Docker Compose

channels:
  telemetry:
    address: scooters/{scooterId}/telemetry
    parameters:
      scooterId:
        $ref: '#/components/parameters/scooterId'
    messages:
      telemetry:
        $ref: '#/components/messages/Telemetry'
  status:
    address: scooters/{scooterId}/status
    parameters:
      scooterId:
        $ref: '#/components/parameters/scooterId'
    messages:
      status:
        $ref: '#/components/messages/Status'
  command:
    address: scooters/{scooterId}/cmd
    parameters:
      scooterId:
        $ref: '#/components/parameters/scooterId'
    messages:
      command:
        $ref: '#/components/messages/Command'
  ack:
    address: scooters/{scooterId}/ack
    parameters:
      scooterId:
        $ref: '#/components/parameters/scooterId'
    messages:
      ack:
        $ref: '#/components/messages/Ack'

operations:
  sendTelemetry:
    action: send
    channel:
      $ref: '#/channels/telemetry'
    summary: Okresowy raport hulajnogi (domyślnie co 5 s, także bez przejazdu)
    messages:
      - $ref: '#/channels/telemetry/messages/telemetry'
  sendStatus:
    action: send
    channel:
      $ref: '#/channels/status'
    summary: Status połączenia (retained); offline publikuje broker jako Last Will
    messages:
      - $ref: '#/channels/status/messages/status'
  receiveCommand:
    action: receive
    channel:
      $ref: '#/channels/command'
    summary: Komenda z backendu
    messages:
      - $ref: '#/channels/command/messages/command'
  sendAck:
    action: send
    channel:
      $ref: '#/channels/ack'
    summary: Potwierdzenie wykonania lub odrzucenia komendy
    messages:
      - $ref: '#/channels/ack/messages/ack'

components:
  parameters:
    scooterId:
      description: Numer hulajnogi, czterocyfrowy z zerami wiodącymi, np. 0142
  messages:
    Telemetry:
      name: Telemetry
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Telemetry'
      examples:
        - name: wTrakcieJazdy
          payload:
            ts: '2026-11-09T14:35:12.204Z'
            lat: 50.0921
            lon: 18.5418
            bat: 71
            v: 14.2
            locked: false
            buffered: false
    Status:
      name: Status
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Status'
    Command:
      name: Command
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Command'
      examples:
        - name: odblokowanie
          payload:
            commandId: 6f1c2d0e-3b1a-4b8e-9b55-0a1f4c2e7d10
            cmd: unlock
            issuedAt: '2026-11-09T14:19:02.000Z'
            expiresAt: '2026-11-09T14:19:12.000Z'
        - name: limitPredkosci
          payload:
            commandId: 0b7e4a35-91d2-4f3c-8a64-2c5d1e9f7a21
            cmd: speed_limit
            issuedAt: '2026-11-09T14:24:10.000Z'
            expiresAt: '2026-11-09T14:24:20.000Z'
            params:
              kmh: 10
    Ack:
      name: Ack
      contentType: application/json
      payload:
        $ref: '#/components/schemas/Ack'
      examples:
        - name: przeterminowana
          payload:
            commandId: 6f1c2d0e-3b1a-4b8e-9b55-0a1f4c2e7d10
            ok: false
            reason: EXPIRED
            ts: '2026-11-09T14:20:31.512Z'
  schemas:
    Telemetry:
      type: object
      required: [ts, lat, lon, bat, v, locked]
      properties:
        ts:
          type: string
          format: date-time
          description: Czas pomiaru na urządzeniu (UTC)
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        bat:
          type: integer
          minimum: 0
          maximum: 100
          description: Poziom baterii w procentach
        v:
          type: number
          minimum: 0
          description: Prędkość w km/h
        locked:
          type: boolean
          description: Czy hulajnoga jest zablokowana
        buffered:
          type: boolean
          default: false
          description: Punkt wysłany z bufora po odzyskaniu łączności
    Status:
      type: object
      required: [online]
      properties:
        online:
          type: boolean
        firmware:
          type: string
        since:
          type: string
          format: date-time
    Command:
      type: object
      required: [commandId, cmd, issuedAt]
      properties:
        commandId:
          type: string
          format: uuid
        cmd:
          type: string
          enum: [unlock, lock, speed_limit, stop_gradually, ring, lights]
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            Termin ważności komendy (od 1.1.0, opcjonalny). Backend ustawia go
            zawsze na issuedAt + 10 s, czyli na limit oczekiwania na potwierdzenie.
            Hulajnoga po tym czasie nie wykonuje komendy i odpowiada ok = false
            z powodem EXPIRED. Komenda bez tego pola nie wygasa.
        params:
          type: object
          properties:
            kmh:
              type: integer
              minimum: 0
              description: Limit prędkości dla speed_limit
            on:
              type: boolean
              description: Włączenie lub wyłączenie dla lights
    Ack:
      type: object
      required: [commandId, ok, ts]
      properties:
        commandId:
          type: string
          format: uuid
        ok:
          type: boolean
        reason:
          type: string
          enum: [LOW_BATTERY, ALREADY_IN_STATE, HARDWARE_ERROR, UNKNOWN_COMMAND, EXPIRED]
          description: Powód odrzucenia, gdy ok = false (EXPIRED od 1.1.0, komenda po expiresAt)
        ts:
          type: string
          format: date-time
