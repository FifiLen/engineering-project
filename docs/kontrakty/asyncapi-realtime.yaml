                urlExpiresAt: '2026-11-18T14:32:00.000Z'
                fileName: S-1037-protokol-serwisowy.docx
                sizeBytes: 41230
              pdf:
                url: /files/1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f?exp=1795040000&sig=def
                urlExpiresAt: '2026-11-18T14:32:00.000Z'
                fileName: S-1037-protokol-serwisowy.pdf
                sizeBytes: 88412
    DataExportReady:
      name: data-export.ready
      payload:
        description: DataExportReady z packages/shared/src/realtime.ts (ADR 0069)
        type: object
        required: [id, status, state, sizeBytes, expiresAt]
        properties:
          id: { type: string, format: uuid }
          status: { type: string, enum: [SUCCEEDED, FAILED] }
          state: { type: string, enum: [SUCCEEDED, FAILED] }
          sizeBytes: { type: [integer, 'null'] }
          expiresAt: { type: [string, 'null'], format: date-time, description: 'Ważność pliku: 7 dni od przygotowania' }
  schemas:
    DocumentFileLink:
      type: object
      description: Plik wydruku z adresem z podpisem HMAC na 10 min (ADR 0057)
      required: [url, urlExpiresAt, fileName, sizeBytes]
      properties:
        url: { type: string, description: 'Adres względny /files/{id}?exp&sig; klient dokleja adres API' }
        urlExpiresAt: { type: string, format: date-time }
        fileName: { type: string }
        sizeBytes: { type: integer }
    RentalState:
      type: string
      description: Stan przejazdu (ADR 0013, maszyna stanów w core)
      enum: [RESERVED, UNLOCKING, ACTIVE, PAUSED, ENDING, ENDED, EXPIRED, UNLOCK_FAILED, UNPAID]
    FleetStatus:
      type: string
      description: Status floty dla operatora (fn_fleet_status w bazie, deriveFleetStatus w core, ADR 0033)
      enum: [AVAILABLE, RESERVED, IN_USE, LOW_BATTERY, MAINTENANCE, OFFLINE, RETIRED]
    FleetMapScooter:
      type: object
      required: [id, number, lat, lon, batteryPct, fleetStatus, online, lastSeenAt, speedKmh, locked]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          maximum: 9999
        lat:
          type: [number, 'null']
        lon:
          type: [number, 'null']
        batteryPct:
          type: [integer, 'null']
        fleetStatus:
          $ref: '#/components/schemas/FleetStatus'
        online:
          type: boolean
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        speedKmh:
          type: [number, 'null']
          description: Z ostatniej telemetrii; null w zdarzeniu zmiany łączności
        locked:
          type: [boolean, 'null']
          description: Z ostatniej telemetrii; null w zdarzeniu zmiany łączności
    CommandView:
      type: object
      required: [id, scooterId, scooterNumber, type, status, sentAt, ackedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Równy commandId w wiadomości MQTT
        scooterId:
          type: string
          format: uuid
        scooterNumber:
          type: integer
        type:
          type: string
          enum: [UNLOCK, LOCK, SPEED_LIMIT, STOP_GRADUALLY, RING, LIGHTS, RELEASE_STOP, BATTERY_SWAPPED]
        status:
          type: string
          enum: [SENT, ACKED, REJECTED, TIMEOUT]
        sentAt:
          type: string
          format: date-time
        ackedAt:
          type: [string, 'null']
          format: date-time
