        description: SimulatorStatusView z packages/shared/src/simulator.ts
        type: object
        required: [status, receivedAt, enabled, stale]
        properties:
          status:
            type: [object, 'null']
            description: Ostatnia wiadomość z simulator/status (simulatorStatusSchema; online, liczniki, aktywne scenariusze); null przed pierwszą
          receivedAt: { type: [string, 'null'], format: date-time }
          enabled: { type: boolean, description: SIMULATOR_CONTROL_ENABLED }
          stale: { type: boolean, description: 'Brak stanu albo stan starszy niż 30 s: „Symulator nie odpowiada”' }
    SimulatorResult:
      name: simulator.result
      payload:
        description: SimulatorResult z packages/shared/src/simulator.ts (wiadomość z simulator/control/result)
        type: object
        required: [commandId, ok]
        properties:
          commandId: { type: string, format: uuid }
          ok: { type: boolean }
          reason:
            type: string
            enum:
              [
                SCENARIO_ACTIVE,
                NO_SCENARIO,
                SCOOTER_NOT_FOUND,
                ZONE_NOT_FOUND,
                ROUTE_NOT_FOUND,
                INVALID_PARAMS,
                EXPIRED,
              ]
    ZonesChanged:
      name: zones.changed
      payload:
        description: ZonesChanged z packages/shared/src/realtime.ts
        type: object
        required: [zoneIds, at]
        properties:
          zoneIds: { type: array, items: { type: string, format: uuid } }
          at: { type: string, format: date-time }
    ContentUpdated:
      name: content.updated
      payload:
        description: >-
          ContentUpdated z packages/shared/src/realtime.ts; licznik wspólny dla strony i aplikacji. Klient po
          zdarzeniu pobiera treść żądaniem warunkowym; o świeżości decyduje skrót treści, nie rewizja.
        type: object
        required: [revision, clients, at]
        properties:
          revision: { type: integer, minimum: 0 }
          clients: { type: array, items: { type: string, enum: [WEB, MOBILE, ADMIN] } }
          at: { type: string, format: date-time }
    DocumentReady:
      name: document.ready
      payload:
        description: DocumentReady z packages/shared/src/realtime.ts (ADR 0066)
        type: object
        required: [id, documentType, status, format, files]
        properties:
          id: { type: string, format: uuid }
          documentType:
            type: string
            enum:
              [
                RENTAL_CONFIRMATION,
                SERVICE_PROTOCOL,
                SCOOTER_CARD,
                INCIDENT_REPORT,
                WALLET_ADJUSTMENT,
                RECEIPT,
                SCOOTER_LABEL,
              ]
          status: { type: string, enum: [SUCCEEDED, FAILED] }
          format: { type: string, enum: [DOCX, PDF] }
          errorCode:
            type: string
            description: 'Tylko przy FAILED: RENDER_TIMEOUT, RENDERER_UNAVAILABLE, RENDER_FAILED, TEMPLATE_RENDER_FAILED, DOCUMENT_SOURCE_NOT_FOUND'
          files:
            type: object
            description: Pliki dostępne do pobrania; przy błędzie PDF zostaje DOCX
            properties:
              docx: { $ref: '#/components/schemas/DocumentFileLink' }
              pdf: { $ref: '#/components/schemas/DocumentFileLink' }
      examples:
        - name: protokol-gotowy
          payload:
