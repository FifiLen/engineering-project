asyncapi: 3.0.0
info:
  title: Zdarzenia na żywo (Socket.IO)
  version: 1.6.1
  description: |
    Kontrakt zdarzeń Socket.IO między backendem a panelem operatora i aplikacją (ADR 0012).
    Operacje opisane z perspektywy backendu. Typy w kodzie: packages/shared/src/realtime.ts.

    Zasady:
    * Stan źródłowy zawsze można pobrać przez REST; zdarzenia tylko przyspieszają odświeżenie.
    * Po ponownym połączeniu klient pobiera stan od nowa (np. GET /admin/fleet/map).
    * Zdarzenia przychodzą w kolejności wysłania; klient stosuje je po kolei.
    * Od iteracji 2 dołączenie do pokoju fleet wymaga zalogowanego operatora z uprawnieniem scooters.read.
    * Połączenie wymaga tokenu dostępowego w `auth.token` (ADR 0035): operatora albo klienta.
      Klient trafia do pokoju user:{id}, a operator do pokoju staff:{id} od razu po połączeniu, bez osobnej
      subskrypcji.
    * Dołączenie do pokoju operatora odpowiada potwierdzeniem (ack) { ok: true } albo
      { ok: false, code: UNAUTHENTICATED | FORBIDDEN } (SubscribeAck).

    Historia:
    * 1.0.0 (iteracja 1): pokój fleet (panel).
    * 1.1.0 (iteracja 3, ADR 0036): pokój rentals (panel, uprawnienie rentals.read) ze zdarzeniem
      rentals.changed oraz pokój user:{id} (aplikacja) ze zdarzeniem rental.updated. Osobny pokój
      rental:{id} z ADR 0012 okazał się zbędny: właściciel dostaje zmiany w user:{id}, a panel
      wszystkie przejazdy w rentals.
    * 1.2.0 (iteracja 4, ADR 0043 i 0044): zdarzenie zones.changed do wszystkich połączonych po zmianie
      stref w panelu; rental.updated ma strefy hulajnogi (zones) i wymagania stref (zoneControl).
    * 1.3.0 (iteracja 5, ADR 0049 i 0050): zdarzenie wallet.updated w pokoju user:{id} po każdym ruchu
      w portfelu, zmianie płatności, zaległości i zapisanych kartach; rental.updated ma rozliczenie
      (settlement) zamiast stałej wartości PENDING.
    * 1.4.0 (iteracja 6, ADR 0055, 0056, 0058, 0059, 0060): pokoje panelu tickets (tickets.read),
      service (service.read) i simulator (simulator.manage, tylko przy SIMULATOR_CONTROL_ENABLED)
      z subskrypcjami tickets.subscribe, service.subscribe i simulator.subscribe; zdarzenia
      ticket.updated (pokój tickets i pokój user:{id} zgłaszającego), service-task.updated,
      simulator.status, simulator.result oraz notification.created w pokoju user:{id}.
      rental.updated ma pola zakończenia bez łączności, zdjęcia parkowania, zatrzymania naliczania,
      progu baterii i opłaty za odholowanie (price.towingFee); CommandView zna RELEASE_STOP
      i BATTERY_SWAPPED.
    * 1.5.0 (iteracja 7, ADR 0062): zdarzenie content.updated do wszystkich połączonych po zatwierdzeniu
      zmiany treści (sekcje, FAQ, aktualności, media, dane firmy, dokumenty prawne, modele) i na granicy
      publikacji aktualności; aplikacja pobiera GET /content/mobile z If-None-Match, gdy rewizja jest wyższa.
      Strona dostaje odświeżenie wywołaniem HTTP (site.revalidate, ADR 0065), nie przez Socket.IO.
    * 1.6.0 (iteracja 7, ADR 0066, 0068, 0069): pokój operatora staff:{id}, do którego gniazdo operatora
      dołącza przy połączeniu (bez subskrypcji), ze zdarzeniem document.ready po stanie końcowym jego wydruku;
      document.ready także w pokoju user:{id} (paragon PDF klienta) i data-export.ready w pokoju user:{id}
      po przygotowaniu albo błędzie eksportu danych. Adresy plików mają podpis HMAC na 10 min (ADR 0057).
      notification.created zna kod data_export_ready. ADR 0066 i 0069 zapowiadały te zdarzenia w 1.5.0;
      tę wersję zajęło wcześniej content.updated, więc trafiły do 1.6.0.
    * 1.6.1 (poprawki po przeglądzie iteracji 7): bez zmiany ładunku. Po content.updated aplikacja zawsze
      wysyła żądanie warunkowe GET /content/mobile (bez porównywania rewizji): licznik rośnie już w niezatwierdzonej
      transakcji, a ETag odpowiedzi to skrót treści (pole hash), więc 304 albo ten sam skrót nic nie zmienia.

servers:
  lokalny:
    host: localhost:3001
    protocol: ws
    description: Backend API (Socket.IO na tym samym porcie co REST)

channels:
  fleet:
    address: fleet
    description: Pokój panelu z pozycjami i statusami całej floty
    messages:
      subscribe:
        $ref: '#/components/messages/FleetSubscribe'
      updates:
        $ref: '#/components/messages/FleetUpdates'
      command:
        $ref: '#/components/messages/FleetCommand'

  rentals:
    address: rentals
    description: Pokój panelu ze zmianami przejazdów (lista, szczegóły, oś czasu)
    messages:
      subscribe:
        $ref: '#/components/messages/RentalsSubscribe'
      changed:
        $ref: '#/components/messages/RentalsChanged'
  zones:
    address: null
    description: Wszyscy połączeni (panel i aplikacja); zmiana stref w edytorze panelu
    messages:
      changed:
        $ref: '#/components/messages/ZonesChanged'
  content:
    address: null
    description: Wszyscy połączeni (panel i aplikacja); zmiana treści po zatwierdzeniu zapisu (ADR 0062)
    messages:
      updated:
        $ref: '#/components/messages/ContentUpdated'
  user:
    address: user:{userId}
    description: Pokój klienta; zmiany jego przejazdów, portfela, zgłoszeń i powiadomień na wszystkich urządzeniach
    parameters:
      userId:
        description: Identyfikator klienta z tokenu dostępowego
    messages:
      rentalUpdated:
        $ref: '#/components/messages/RentalUpdated'
      walletUpdated:
        $ref: '#/components/messages/WalletUpdated'
      ticketUpdated:
        $ref: '#/components/messages/CustomerTicketUpdated'
      notificationCreated:
        $ref: '#/components/messages/NotificationCreated'
      documentReady:
        $ref: '#/components/messages/DocumentReady'
      dataExportReady:
        $ref: '#/components/messages/DataExportReady'

  staff:
    address: staff:{staffId}
    description: Pokój operatora; jego wydruki w stanie końcowym (ADR 0066). Gniazdo operatora dołącza przy połączeniu.
    parameters:
      staffId:
        description: Identyfikator operatora z tokenu dostępowego
    messages:
      documentReady:
        $ref: '#/components/messages/DocumentReady'

  tickets:
    address: tickets
    description: Pokój panelu ze zmianami zgłoszeń (lista, licznik nowych w nawigacji, szczegóły); ADR 0055
    messages:
      subscribe:
        $ref: '#/components/messages/TicketsSubscribe'
      updated:
        $ref: '#/components/messages/TicketUpdated'

  service:
    address: service
    description: Pokój panelu ze zmianami zadań serwisowych (lista, Moje zadania, szczegóły); ADR 0055
    messages:
      subscribe:
        $ref: '#/components/messages/ServiceSubscribe'
      taskUpdated:
        $ref: '#/components/messages/ServiceTaskUpdated'

  simulator:
    address: simulator
    description: |
      Pokój panelu ze stanem symulatora i wynikami poleceń (ADR 0059). API przekazuje tu wiadomości
      z MQTT simulator/status i simulator/control/result (kontrakt asyncapi-symulator.yaml). Przy
      SIMULATOR_CONTROL_ENABLED=false subskrypcja kończy się FORBIDDEN.
    messages:
      subscribe:
        $ref: '#/components/messages/SimulatorSubscribe'
      status:
        $ref: '#/components/messages/SimulatorStatus'
      result:
        $ref: '#/components/messages/SimulatorResult'

operations:
  receiveRentalsSubscribe:
    action: receive
    channel:
      $ref: '#/channels/rentals'
    summary: 'rentals.subscribe: operator dołącza do pokoju rentals (rentals.read); odpowiedź (ack) { ok: true }'
    messages:
      - $ref: '#/channels/rentals/messages/subscribe'
  sendRentalsChanged:
    action: send
    channel:
      $ref: '#/channels/rentals'
    summary: 'rentals.changed: wiersz listy przejazdów po każdej zmianie stanu, komendy w toku albo problemu'
    messages:
      - $ref: '#/channels/rentals/messages/changed'
  sendRentalUpdated:
    action: send
    channel:
      $ref: '#/channels/user'
    summary: 'rental.updated: pełny widok przejazdu klienta (stan, komenda w toku, komunikat, liczniki na chwilę asOf)'
    messages:
      - $ref: '#/channels/user/messages/rentalUpdated'
  sendWalletUpdated:
    action: send
    channel:
      $ref: '#/channels/user'
    summary: 'wallet.updated: saldo, minimalne saldo i zaległości klienta (te same pola co GET /me/wallet bez historii)'
    messages:
      - $ref: '#/channels/user/messages/walletUpdated'
  sendTicketUpdatedToUser:
    action: send
    channel:
      $ref: '#/channels/user'
    summary: 'ticket.updated: zmiana statusu, przypisania albo odpowiedzi zgłoszenia klienta (tylko jego zgłoszenia, bez assigneeId)'
    messages:
      - $ref: '#/channels/user/messages/ticketUpdated'
  sendNotificationCreated:
    action: send
    channel:
      $ref: '#/channels/user'
    summary: 'notification.created: powiadomienie po wysyłce (SENT) albo pominięte z braku tokenu (SKIPPED, NO_PUSH_TOKEN); wersja web pokazuje baner, aplikacja natywna pomija'
    messages:
      - $ref: '#/channels/user/messages/notificationCreated'
  sendDocumentReadyToStaff:
    action: send
    channel:
      $ref: '#/channels/staff'
    summary: 'document.ready: wydruk operatora gotowy (SUCCEEDED) albo nieudany (FAILED z errorCode; przy błędzie PDF zostaje DOCX)'
    messages:
      - $ref: '#/channels/staff/messages/documentReady'
  sendDocumentReadyToUser:
    action: send
    channel:
      $ref: '#/channels/user'
    summary: 'document.ready: paragon PDF klienta gotowy albo nieudany (POST /me/receipts/{id}/pdf)'
    messages:
      - $ref: '#/channels/user/messages/documentReady'
  sendDataExportReady:
    action: send
    channel:
      $ref: '#/channels/user'
    summary: 'data-export.ready: eksport danych klienta gotowy (rozmiar, ważność 7 dni) albo nieudany; adres pliku z GET /me/data-exports/latest'
    messages:
      - $ref: '#/channels/user/messages/dataExportReady'
  receiveTicketsSubscribe:
    action: receive
    channel:
      $ref: '#/channels/tickets'
    summary: 'tickets.subscribe: operator dołącza do pokoju tickets (tickets.read); odpowiedź (ack) SubscribeAck'
    messages:
      - $ref: '#/channels/tickets/messages/subscribe'
  sendTicketUpdated:
    action: send
    channel:
      $ref: '#/channels/tickets'
    summary: 'ticket.updated: utworzenie zgłoszenia (także automatycznego) i każda zmiana statusu, przypisania albo odpowiedzi'
    messages:
      - $ref: '#/channels/tickets/messages/updated'
  receiveServiceSubscribe:
    action: receive
    channel:
      $ref: '#/channels/service'
    summary: 'service.subscribe: operator dołącza do pokoju service (service.read); odpowiedź (ack) SubscribeAck'
    messages:
      - $ref: '#/channels/service/messages/subscribe'
  sendServiceTaskUpdated:
    action: send
    channel:
      $ref: '#/channels/service'
    summary: 'service-task.updated: utworzenie zadania i każda zmiana statusu, przypisania albo części'
    messages:
      - $ref: '#/channels/service/messages/taskUpdated'
  receiveSimulatorSubscribe:
    action: receive
    channel:
      $ref: '#/channels/simulator'
    summary: 'simulator.subscribe: operator dołącza do pokoju simulator (simulator.manage, tylko przy włączonym sterowaniu); odpowiedź (ack) SubscribeAck'
    messages:
      - $ref: '#/channels/simulator/messages/subscribe'
  sendSimulatorStatus:
    action: send
    channel:
      $ref: '#/channels/simulator'
    summary: 'simulator.status: stan z simulator/status przekazany przez API (SimulatorStatusView)'
    messages:
      - $ref: '#/channels/simulator/messages/status'
  sendSimulatorResult:
    action: send
    channel:
      $ref: '#/channels/simulator'
    summary: 'simulator.result: wynik polecenia z simulator/control/result'
    messages:
      - $ref: '#/channels/simulator/messages/result'
  sendZonesChanged:
    action: send
    channel:
      $ref: '#/channels/zones'
    summary: 'zones.changed: identyfikatory zmienionych stref; geometrie pobiera się przez GET /zones albo GET /admin/zones'
    messages:
      - $ref: '#/channels/zones/messages/changed'
  sendContentUpdated:
    action: send
    channel:
      $ref: '#/channels/content'
    summary: 'content.updated: rewizja treści (fn_content_revision) i klienci, których dotyczy zmiana'
    messages:
      - $ref: '#/channels/content/messages/updated'
  receiveSubscribe:
    action: receive
    channel:
      $ref: '#/channels/fleet'
    summary: 'fleet.subscribe: klient dołącza do pokoju fleet; odpowiedź (ack) { ok: true }'
    messages:
      - $ref: '#/channels/fleet/messages/subscribe'
  sendUpdates:
    action: send
    channel:
      $ref: '#/channels/fleet'
    summary: 'fleet.updates: zmiany z jednego okna telemetrii (domyślnie 1 s) i zmiany łączności'
    messages:
      - $ref: '#/channels/fleet/messages/updates'
  sendCommand:
    action: send
    channel:
      $ref: '#/channels/fleet'
    summary: 'fleet.command: wysłanie komendy i każda zmiana jej statusu (ACKED, REJECTED, TIMEOUT)'
    messages:
      - $ref: '#/channels/fleet/messages/command'

components:
  messages:
    FleetSubscribe:
      name: fleet.subscribe
      payload:
        type: 'null'
    FleetUpdates:
      name: fleet.updates
      payload:
        type: array
        items:
          $ref: '#/components/schemas/FleetMapScooter'
      examples:
        - name: telemetria
          payload:
            - id: 8f42296b-95f1-47ec-b1b8-3b933dd0c42f
              number: 142
              lat: 50.0921
              lon: 18.5418
              batteryPct: 6
              fleetStatus: LOW_BATTERY
              online: true
              lastSeenAt: '2026-11-16T14:31:02.000Z'
              speedKmh: 0
              locked: true
    FleetCommand:
      name: fleet.command
      payload:
        $ref: '#/components/schemas/CommandView'
    RentalsSubscribe:
      name: rentals.subscribe
      payload:
        type: 'null'
    RentalsChanged:
      name: rentals.changed
      payload:
        description: RentalListItem z packages/shared/src/admin/rentals.ts (te same pola co GET /admin/rentals)
        type: object
        required: [id, number, state, hasProblem, scooterNumber, pendingCommand]
        properties:
          id: { type: string, format: uuid }
          number: { type: integer }
          state: { $ref: '#/components/schemas/RentalState' }
          hasProblem: { type: boolean }
          scooterNumber: { type: integer }
          pendingCommand: { type: [string, 'null'], enum: [LOCK, UNLOCK, RING, null] }
    RentalUpdated:
      name: rental.updated
      payload:
        description: RentalView z packages/shared/src/rentals.ts (te same pola co GET /rentals/current)
        type: object
        required: [id, number, state, pendingCommand, notice, rideSeconds, pauseSeconds, price, asOf]
        properties:
          id: { type: string, format: uuid }
          number: { type: integer }
          state: { $ref: '#/components/schemas/RentalState' }
          pendingCommand: { type: [string, 'null'], enum: [LOCK, UNLOCK, null] }
          notice: { type: [string, 'null'], enum: [PAUSE_FAILED, RESUME_FAILED, LOCK_FAILED, ENDED_REMOTELY, null] }
          rideSeconds: { type: integer, description: Liczone na chwilę asOf; aplikacja dolicza upływ czasu lokalnie }
          pauseSeconds: { type: integer }
          price:
            type: object
            description: Kwoty w groszach (ADR 0042); od 1.4.0 towingFee (0 bez opłaty, ADR 0060), a total ją obejmuje
            properties:
              towingFee: { type: integer }
              total: { type: integer }
          zones:
            type: array
            description: Strefy, w których jest hulajnoga (wykrywanie z telemetrii, ADR 0043), od najbardziej restrykcyjnej
            items:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
                type: { type: string, enum: [SERVICE_AREA, PARKING, SLOW, NO_RIDE] }
                speedLimitKmh: { type: [integer, 'null'] }
          zoneControl:
            type: object
            description: Wymagania stref (ADR 0044); aplikacja pokazuje z nich komunikat strefy na ekranie jazdy
            properties:
              stopped: { type: boolean, description: Strefa zakazu albo poza obszarem działania }
              speedLimitKmh: { type: [integer, 'null'] }
          settlement:
            type: object
            description: Rozliczenie przejazdu (RentalSettlementView, ADR 0049)
            required: [state, source, paidAmount, refundedAmount]
            properties:
              state: { type: string, enum: [NONE, WALLET_PAID, CARD_PENDING, CARD_PAID, FAILED] }
              source: { type: string, enum: [WALLET, CARD] }
              paidAmount: { type: integer, description: Grosze }
              refundedAmount: { type: integer }
              receiptId: { type: [string, 'null'], format: uuid }
              failureCode: { type: [string, 'null'], description: Kod odmowy operatora przy FAILED }
          endMode:
            type: [string, 'null']
            enum: [CUSTOMER, CUSTOMER_OFFLINE, REMOTE, UNCONFIRMED, null]
            description: Tryb zakończenia (ADR 0056); null przed żądaniem zakończenia
          parkingPhotoRequired:
            { type: boolean, description: Zdjęcie parkowania wymagane po zakończeniu bez łączności, dopóki go nie ma }
          parkingPhoto:
            type: [object, 'null']
            description: FileView z packages/shared/src/files.ts; url to adres względny /files/{id}?exp=…&sig=… (ADR 0057)
          scooterOnline: { type: boolean, description: Łączność hulajnogi według statusu z brokera }
          positionAt:
            {
              type: [string, 'null'],
              format: date-time,
              description: Czas ostatniej pozycji (warunek zakończenia offline,
              120 s),
            }
          billingStopped:
            { type: boolean, description: Naliczanie zatrzymane po 30 min bez łączności (BILLING_STOPPED) }
          billingStoppedAt: { type: [string, 'null'], format: date-time }
          batteryAlert:
            {
              type: [string, 'null'],
              enum: [LOW, CRITICAL, null],
              description: Najpoważniejszy próg baterii w przejeździe,
            }
          asOf: { type: string, format: date-time }
    WalletUpdated:
      name: wallet.updated
      payload:
        description: WalletSummary z packages/shared/src/payments.ts
        type: object
        required: [balance, minWalletBalance, overdue, asOf]
        properties:
          balance: { type: integer, description: Saldo z księgi w groszach; może być ujemne (pytanie 4) }
          minWalletBalance:
            { type: integer, description: Minimalne saldo do jazdy z portfela z obowiązującej wersji cennika }
          overdue:
            type: array
            description: Przejazdy UNPAID z kwotą, kartą, kodem odmowy i terminem automatycznego ponowienia
            items:
              type: object
              properties:
                rentalId: { type: string, format: uuid }
                number: { type: integer }
                amount: { type: integer }
                failureCode: { type: [string, 'null'] }
                retryAt: { type: [string, 'null'], format: date-time }
                paymentPending: { type: boolean }
          asOf: { type: string, format: date-time }
    TicketsSubscribe:
      name: tickets.subscribe
      payload:
        type: 'null'
    ServiceSubscribe:
      name: service.subscribe
      payload:
        type: 'null'
    SimulatorSubscribe:
      name: simulator.subscribe
      payload:
        type: 'null'
    TicketUpdated:
      name: ticket.updated
      payload:
        description: TicketUpdated z packages/shared/src/realtime.ts; bez nazwisk i notatek, szczegóły przez REST
        type: object
        required: [id, number, scooterId, source, autoKind, status, urgent, assigneeId, hasUnreadReply, updatedAt]
        properties:
          id: { type: string, format: uuid }
          number: { type: integer, description: 'Numer zgłoszenia, pokazywany jako Z-1042' }
          scooterId: { type: string, format: uuid }
          source: { type: string, enum: [USER, AUTO, STAFF] }
          autoKind: { type: [string, 'null'], enum: [OFFLINE, BATTERY_CRITICAL, OUT_OF_ZONE, null] }
          status: { type: string, enum: [NEW, IN_PROGRESS, AT_SERVICE, RESOLVED] }
          urgent: { type: boolean }
          assigneeId: { type: [string, 'null'], format: uuid }
          hasUnreadReply: { type: boolean, description: Nowa odpowiedź dla klienta, jeszcze nieprzeczytana }
          updatedAt: { type: string, format: date-time }
      examples:
        - name: odpowiedz
          payload:
            id: 5b1c2f0e-8a8e-4f6c-9d3a-1f2e3d4c5b6a
            number: 1042
            scooterId: 8f42296b-95f1-47ec-b1b8-3b933dd0c42f
            source: USER
            autoKind: null
            status: RESOLVED
            urgent: true
            assigneeId: null
            hasUnreadReply: true
            updatedAt: '2026-11-18T10:15:00.000Z'
    CustomerTicketUpdated:
      name: ticket.updated
      payload:
        description: TicketUpdated z packages/shared/src/realtime.ts bez assigneeId (klient nie dostaje danych o operatorach)
        type: object
        required: [id, number, scooterId, source, autoKind, status, urgent, hasUnreadReply, updatedAt]
        properties:
          id: { type: string, format: uuid }
          number: { type: integer, description: 'Numer zgłoszenia, pokazywany jako Z-1042' }
          scooterId: { type: string, format: uuid }
          source: { type: string, enum: [USER, AUTO, STAFF] }
          autoKind: { type: [string, 'null'], enum: [OFFLINE, BATTERY_CRITICAL, OUT_OF_ZONE, null] }
          status: { type: string, enum: [NEW, IN_PROGRESS, AT_SERVICE, RESOLVED] }
          urgent: { type: boolean }
          hasUnreadReply: { type: boolean, description: Nowa odpowiedź dla klienta, jeszcze nieprzeczytana }
          updatedAt: { type: string, format: date-time }
    ServiceTaskUpdated:
      name: service-task.updated
      payload:
        description: ServiceTaskUpdated z packages/shared/src/realtime.ts
        type: object
        required: [id, number, scooterId, ticketId, type, status, priority, assigneeId, updatedAt]
        properties:
          id: { type: string, format: uuid }
          number: { type: integer, description: 'Numer zadania, pokazywany jako S-…' }
          scooterId: { type: string, format: uuid }
          ticketId: { type: [string, 'null'], format: uuid }
          type: { type: string, enum: [REPAIR, BATTERY_SWAP, INSPECTION, RELOCATION] }
          status: { type: string, enum: [OPEN, IN_PROGRESS, DONE, CANCELLED] }
          priority: { type: string, enum: [LOW, NORMAL, HIGH] }
          assigneeId: { type: [string, 'null'], format: uuid }
          updatedAt: { type: string, format: date-time }
    NotificationCreated:
      name: notification.created
      payload:
        description: NotificationView z packages/shared/src/notifications.ts (treść po renderowaniu szablonu, ADR 0058)
        type: object
        required: [id, templateCode, title, body, path, createdAt, readAt]
        properties:
          id: { type: integer }
          templateCode:
            type: string
            enum:
              [
                reservation_ending,
                ride_ended,
                payment_failed,
                battery_low,
                ticket_received,
                ticket_status_changed,
                login_code,
                data_export_ready,
              ]
          title: { type: [string, 'null'] }
          body: { type: string }
          path:
            {
              type: [string, 'null'],
              description: 'Ekran aplikacji (Expo Router), np. /zgloszenie/{id}; null bez ekranu',
            }
          createdAt: { type: string, format: date-time }
          readAt: { type: [string, 'null'], format: date-time }
      examples:
        - name: przejazd-zakonczony
          payload:
            id: 381
            templateCode: ride_ended
            title: Przejazd zakończony
            body: 'Przejazd R-51858 trwał 16 minut. Koszt: 12,60 zł. Paragon w aplikacji.'
            path: /podsumowanie/2c9d6a1e-3b4f-4e5a-8c7d-9e0f1a2b3c4d
            createdAt: '2026-11-18T10:20:00.000Z'
            readAt: null
    SimulatorStatus:
