<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Przyjazny i lekki – ekran mapy</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #FF7A3D. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&amp;family=DM+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2A1F1A}a:hover{color:#5A4438}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBEFDF; color: #2A1F1A; font-family: 'DM Sans', system-ui, sans-serif">

<rect x="0" y="0" width="390" height="844" fill="#FBEFDF"></rect>
<rect x="232" y="150" width="140" height="170" rx="30" fill="#D9EDC4"></rect>

<path d="M0 270 L390 226 M124 0 L166 844 M0 680 L390 640" stroke="#FFFFFF" stroke-width="16" fill="none" stroke-linecap="round"></path>
<rect x="80" y="214" width="32" height="32" rx="12" fill="#FF7A3D" stroke="#2A1F1A" stroke-width="2.5"></rect>

<rect x="228" y="408" width="44" height="44" rx="16" fill="#FF7A3D" stroke="#2A1F1A" stroke-width="3"></rect>
<path d="M240 438 L250 424 L262 424" stroke="#2A1F1A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="160" cy="345" r="20" fill="#7CC4FF" fill-opacity="0.3"></circle>
<circle cx="160" cy="345" r="9" fill="#7CC4FF" stroke="#2A1F1A" stroke-width="2.5"></circle>
</svg>
<div style="position: absolute; left: 16px; right: 16px; top: 24px; display: flex; gap: 10px; align-items: center">

<button type="button" style="flex-grow: 1; height: 52px; border-radius: 26px; border: 2px solid #2A1F1A; background: #FFFFFF; text-align: left; padding: 0 20px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; color: #7A6A5F">Dokąd dziś?</button>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFF7EE; border-top: 2px solid #2A1F1A; border-radius: 32px 32px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 18px">
<div style="width: 44px; height: 5px; border-radius: 3px; background: #E2C9AC; align-self: center"></div>
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 64px; height: 64px; border-radius: 22px; background: #F3E3CF; border: 2px dashed #E2C9AC; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #7A6A5F; text-align: center; line-height: 1.2">[3D]</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Czeka na Ciebie!</div>
<div style="font-size: 14px; color: #7A6A5F">#[ID] · 120 m stąd · 2 min pieszo</div>
</div>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #DDF0FF; color: #1B4A73; display: flex; align-items: center; font-size: 14px; font-weight: 600">87% baterii</div>
<div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #F3E3CF; display: flex; align-items: center; font-size: 14px; font-weight: 600">≈ 24 km</div>
<div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #F3E3CF; display: flex; align-items: center; font-size: 14px; font-weight: 600">[CENA] zł/min</div>
</div>
<button type="button" style="height: 56px; border: 2px solid #2A1F1A; border-radius: 28px; background: #FF7A3D; color: #2A1F1A; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; box-shadow: 0 4px 0 #2A1F1A">Skanuj i jedź</button>
</div>
</div>

</html>
