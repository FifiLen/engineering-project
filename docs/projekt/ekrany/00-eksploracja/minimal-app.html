<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Miejski minimalizm – ekran mapy</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Inter+Tight:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ECECE7; color: #16181D; font-family: Inter, system-ui, sans-serif">
<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0; display: block" role="img" aria-label="Mapa okolicy z dostępnymi hulajnogami">
<rect x="0" y="0" width="390" height="844" fill="#ECECE7"></rect>
<rect x="232" y="150" width="140" height="170" rx="12" fill="#DFE4D8"></rect>
<path d="M-10 560 C 110 520 230 640 400 590" stroke="#D3DAE2" stroke-width="30" fill="none"></path>
<path d="M0 120 L390 92 M262 0 L300 844 M42 0 L62 844 M0 420 L390 384 M0 760 L390 730" stroke="#FFFFFF" stroke-width="6" fill="none"></path>
<path d="M0 270 L390 226 M124 0 L166 844 M0 680 L390 640" stroke="#FFFFFF" stroke-width="12" fill="none"></path>
<path d="M30 150 L330 120 L350 470 L56 500 Z" fill="#2B3FF5" fill-opacity="0.06" stroke="#2B3FF5" stroke-width="1.5" stroke-dasharray="6 5"></path>
<circle cx="96" cy="230" r="11" fill="#2B3FF5" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="214" cy="300" r="11" fill="#2B3FF5" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="300" cy="200" r="11" fill="#2B3FF5" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="88" cy="400" r="11" fill="#2B3FF5" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="250" cy="430" r="15" fill="#2B3FF5" stroke="#16181D" stroke-width="3"></circle>
<circle cx="160" cy="345" r="18" fill="#16181D" fill-opacity="0.08"></circle>
<circle cx="160" cy="345" r="7" fill="#16181D" stroke="#FFFFFF" stroke-width="3"></circle>
</svg>
<div style="position: absolute; left: 16px; right: 16px; top: 24px; display: flex; gap: 10px; align-items: center">
<button type="button" aria-label="Profil" style="width: 48px; height: 48px; border-radius: 12px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(22,24,29,0.12)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></button>
<button type="button" style="flex-grow: 1; height: 48px; border-radius: 12px; border: none; background: #FFFFFF; text-align: left; padding: 0 16px; font-family: Inter, sans-serif; font-size: 15px; color: #6B6E75; box-shadow: 0 1px 3px rgba(22,24,29,0.12)">Dokąd jedziesz?</button>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -2px 12px rgba(22,24,29,0.08)">
<div style="width: 40px; height: 4px; border-radius: 2px; background: #D5D5CF; align-self: center"></div>
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Inter Tight', Inter, sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Hulajnoga #[ID]</div>
<div style="font-size: 14px; color: #6B6E75">120 m stąd · 2 min pieszo</div>
</div>
<div style="height: 32px; padding: 0 12px; border-radius: 8px; background: #E3E3DE; display: flex; align-items: center; font-size: 13px; font-weight: 500">87%</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #E3E3DE; border-radius: 10px; overflow: hidden">
<div style="background: #F6F6F3; padding: 12px; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 12px; color: #6B6E75">Zasięg</div><div style="font-size: 16px; font-weight: 600">≈ 24 km</div></div>
<div style="background: #F6F6F3; padding: 12px; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 12px; color: #6B6E75">Start</div><div style="font-size: 16px; font-weight: 600">[CENA] zł</div></div>
<div style="background: #F6F6F3; padding: 12px; display: flex; flex-direction: column; gap: 2px"><div style="font-size: 12px; color: #6B6E75">Minuta</div><div style="font-size: 16px; font-weight: 600">[CENA] zł</div></div>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="flex-grow: 1; height: 52px; border: none; border-radius: 10px; background: #2B3FF5; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">Skanuj i jedź</button>
<button type="button" style="height: 52px; padding: 0 18px; border: 1.5px solid #16181D; border-radius: 10px; background: transparent; color: #16181D; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500">Rezerwuj</button>
</div>
</div>
</div>
</body>
</html>
