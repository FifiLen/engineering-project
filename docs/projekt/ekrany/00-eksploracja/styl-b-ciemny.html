<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Styl B – ciemny, techniczny</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#8A97FF}a:hover{color:#B3BCFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121418; color: #F6F6F3; font-family: Inter, system-ui, sans-serif">
<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0; display: block" role="img" aria-label="Ciemna mapa okolicy z dostępnymi hulajnogami">
<rect x="0" y="0" width="390" height="844" fill="#121418"></rect>
<rect x="232" y="150" width="140" height="170" rx="12" fill="#171B19"></rect>
<path d="M-10 560 C 110 520 230 640 400 590" stroke="#151B26" stroke-width="30" fill="none"></path>
<path d="M0 120 L390 92 M262 0 L300 844 M42 0 L62 844 M0 420 L390 384 M0 760 L390 730" stroke="#1F2229" stroke-width="6" fill="none"></path>
<path d="M0 270 L390 226 M124 0 L166 844 M0 680 L390 640" stroke="#2A2E36" stroke-width="12" fill="none"></path>
<path d="M30 150 L330 120 L350 470 L56 500 Z" fill="#7A88FF" fill-opacity="0.04" stroke="#7A88FF" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 6"></path>
<circle cx="96" cy="230" r="16" fill="#7A88FF" fill-opacity="0.16"></circle><circle cx="96" cy="230" r="6" fill="#7A88FF"></circle>
<circle cx="214" cy="300" r="16" fill="#7A88FF" fill-opacity="0.16"></circle><circle cx="214" cy="300" r="6" fill="#7A88FF"></circle>
<circle cx="300" cy="200" r="16" fill="#7A88FF" fill-opacity="0.16"></circle><circle cx="300" cy="200" r="6" fill="#7A88FF"></circle>
<circle cx="88" cy="400" r="16" fill="#7A88FF" fill-opacity="0.16"></circle><circle cx="88" cy="400" r="6" fill="#7A88FF"></circle>
<path d="M160 345 L160 400 L250 420 L250 430" stroke="#7A88FF" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="3 5" fill="none" stroke-linecap="round"></path>
<circle cx="250" cy="430" r="26" fill="#7A88FF" fill-opacity="0.2"></circle><circle cx="250" cy="430" r="10" fill="#7A88FF" stroke="#16181D" stroke-width="3"></circle>
<circle cx="160" cy="345" r="7" fill="#F6F6F3" stroke="#16181D" stroke-width="3"></circle>
</svg>
<div style="position: absolute; left: 16px; right: 16px; top: 24px; display: flex; gap: 10px; align-items: center">
<button type="button" aria-label="Profil" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid #2E323B; background: #1F2229; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></button>
<button type="button" style="flex-grow: 1; height: 48px; border-radius: 14px; border: 1px solid #2E323B; background: #1F2229; text-align: left; padding: 0 16px; font-family: Inter, sans-serif; font-size: 15px; color: #A3A6AD">Dokąd jedziesz?</button>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 12px; background: #1F2229; border: 1px solid #2E323B; border-radius: 24px; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 18px">
<div style="width: 40px; height: 4px; border-radius: 2px; background: #3A3F49; align-self: center"></div>
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A6AD">#[ID] · 120 m</div>
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600">Gotowa do jazdy</div>
</div>
<div style="display: flex; align-items: center; gap: 3px; padding-top: 6px" aria-label="Bateria 87%"><span style="width: 8px; height: 16px; border-radius: 2px; background: #7A88FF"></span><span style="width: 8px; height: 16px; border-radius: 2px; background: #7A88FF"></span><span style="width: 8px; height: 16px; border-radius: 2px; background: #7A88FF"></span><span style="width: 8px; height: 16px; border-radius: 2px; background: #7A88FF"></span><span style="width: 8px; height: 16px; border-radius: 2px; background: #3A3F49"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-left: 6px">87%</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #16181D; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; color: #A3A6AD">Zasięg</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 15px">≈24 km</div></div>
<div style="background: #16181D; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; color: #A3A6AD">Start</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 15px">[CENA]</div></div>
<div style="background: #16181D; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; color: #A3A6AD">Minuta</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 15px">[CENA]</div></div>
</div>
<button type="button" style="height: 54px; border: none; border-radius: 14px; background: #2B3FF5; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; box-shadow: 0 0 24px #2B3FF566">Skanuj i jedź</button>
</div>
</div>
</body>
</html>
