<!doctype html>
<html lang="pl">
<head>

<title>Styl C – miękki, wyrazisty</title>

<style>

<circle cx="160" cy="345" r="20" fill="#16181D" fill-opacity="0.1"></circle>
<circle cx="160" cy="345" r="9" fill="#FFFFFF" stroke="#16181D" stroke-width="2.5"></circle>
</svg>
<div style="position: absolute; left: 16px; right: 16px; top: 24px; display: flex; gap: 10px; align-items: center">

<button type="button" style="flex-grow: 1; height: 52px; border-radius: 26px; border: 2px solid #16181D; background: #FFFFFF; text-align: left; padding: 0 20px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; color: #6B6E75">Dokąd dziś?</button>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #F6F6F3; border-top: 2px solid #16181D; border-radius: 32px 32px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 18px">
<div style="width: 44px; height: 5px; border-radius: 3px; background: #D5D5CF; align-self: center"></div>
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 64px; height: 64px; border-radius: 22px; background: #E3E3DE; border: 2px dashed #B9B9B2; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #6B6E75">[3D]</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.01em">Czeka na Ciebie!</div>
<div style="font-size: 14px; color: #6B6E75">#[ID] · 120 m stąd · 2 min pieszo</div>
</div>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #E4E7FF; color: #1A2AC0; display: flex; align-items: center; font-size: 14px; font-weight: 600">87% baterii</div>
<div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #E3E3DE; display: flex; align-items: center; font-size: 14px; font-weight: 600">≈ 24 km</div>
<div style="height: 36px; padding: 0 14px; border-radius: 18px; background: #E3E3DE; display: flex; align-items: center; font-size: 14px; font-weight: 600">[CENA] zł/min</div>
</div>
<button type="button" style="height: 56px; border: 2px solid #16181D; border-radius: 28px; background: #2B3FF5; color: #FFFFFF; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; box-shadow: 0 4px 0 #16181D">Skanuj i jedź</button>
</div>
</div>
