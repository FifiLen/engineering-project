<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Produktowy – hulajnoga</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F6F3; color: #16181D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; padding: 20px 20px 32px">
<div style="display: flex; justify-content: space-between; align-items: center">
<button type="button" aria-label="Wróć do mapy" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-size: 13px; font-weight: 500; color: #6B6E75">#[ID]</div>
<button type="button" aria-label="Więcej opcji" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
</div>
<div style="text-align: center; margin-top: 28px; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.03em">Gotowa do jazdy</h1>
<div style="font-size: 15px; color: #6B6E75">120 m stąd · 2 min pieszo</div>
</div>
<div style="height: 290px; margin-top: 12px; display: flex; align-items: center; justify-content: center">
<img src="../../rendery/hulajnoga-grafit-trzy.png" alt="Hulajnoga w wariancie Grafit, widok trzy czwarte" style="height: 280px; width: 100%; object-fit: contain; display: block">
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center">
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 27px; font-weight: 500; letter-spacing: -0.02em">87%</div><div style="font-size: 13px; color: #6B6E75">bateria</div></div>
<div style="display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #E3E3DE; border-right: 1px solid #E3E3DE"><div style="font-size: 27px; font-weight: 500; letter-spacing: -0.02em">24 km</div><div style="font-size: 13px; color: #6B6E75">zasięg</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 27px; font-weight: 500; letter-spacing: -0.02em">[CENA]</div><div style="font-size: 13px; color: #6B6E75">zł / min</div></div>
</div>
<div style="display: flex; justify-content: center; gap: 36px; margin-top: 28px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><button type="button" aria-label="Zadzwoń dzwonkiem hulajnogi" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4l2-2z"></path><path d="M10 21h4"></path></svg></button><div style="font-size: 12px; color: #6B6E75">Dzwonek</div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><button type="button" aria-label="Pokaż trasę do hulajnogi" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0112 0c0 5.5-6 11-6 11z"></path><circle cx="12" cy="10" r="2"></circle></svg></button><div style="font-size: 12px; color: #6B6E75">Trasa</div></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><button type="button" aria-label="Zgłoś problem" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5M12 16.5h.01"></path><circle cx="12" cy="12" r="9"></circle></svg></button><div style="font-size: 12px; color: #6B6E75">Zgłoś</div></div>
</div>
<div style="flex-grow: 1"></div>
<button type="button" aria-label="Przesuń, aby odblokować" style="height: 64px; border-radius: 32px; border: none; background: #E3E3DE; position: relative; padding: 0; font-family: Inter, sans-serif; font-size: 16px; font-weight: 500; color: #6B6E75">
<span style="position: absolute; left: 4px; top: 4px; width: 56px; height: 56px; border-radius: 28px; background: #2B3FF5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
Przesuń, aby odblokować
</button>
</div>
</body>
</html>
