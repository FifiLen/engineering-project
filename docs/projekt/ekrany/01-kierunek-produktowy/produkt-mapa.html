<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Produktowy – mapa</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEFEC; color: #16181D; font-family: Inter, system-ui, sans-serif">
<svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; left: 0; top: 0; display: block" role="img" aria-label="Stonowana mapa okolicy z dostępnymi hulajnogami">
<rect x="0" y="0" width="390" height="844" fill="#EFEFEC"></rect>
<rect x="232" y="150" width="140" height="170" rx="16" fill="#E5E8E1"></rect>
<path d="M-10 560 C 110 520 230 640 400 590" stroke="#DFE3E8" stroke-width="30" fill="none"></path>
<path d="M0 120 L390 92 M262 0 L300 844 M42 0 L62 844 M0 420 L390 384 M0 760 L390 730" stroke="#FAFAF8" stroke-width="5" fill="none"></path>
<path d="M0 270 L390 226 M124 0 L166 844 M0 680 L390 640" stroke="#FFFFFF" stroke-width="10" fill="none"></path>
<circle cx="96" cy="230" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle>
<circle cx="214" cy="300" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle>
<circle cx="300" cy="200" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle>
<circle cx="88" cy="400" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle>
<circle cx="320" cy="330" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle>
<circle cx="250" cy="430" r="22" fill="#2B3FF5" fill-opacity="0.14"></circle>
<circle cx="250" cy="430" r="10" fill="#2B3FF5" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="160" cy="345" r="6" fill="#FFFFFF" stroke="#2B3FF5" stroke-width="3"></circle>
</svg>
<div style="position: absolute; left: 16px; right: 16px; top: 20px; height: 52px; border-radius: 26px; background: rgba(246,246,243,0.78); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 6px 24px rgba(22,24,29,0.10); display: flex; align-items: center; padding: 0 6px 0 18px; gap: 10px; box-sizing: border-box">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6E75" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<button type="button" style="flex-grow: 1; height: 44px; border: none; background: transparent; text-align: left; padding: 0; font-family: Inter, sans-serif; font-size: 16px; color: #6B6E75">Dokąd jedziesz?</button>
<button type="button" aria-label="Profil" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #16181D; color: #F6F6F3; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500">[A]</button>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 12px; border-radius: 32px; background: rgba(246,246,243,0.82); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 12px 40px rgba(22,24,29,0.14); padding: 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; font-weight: 500; color: #6B6E75">Hulajnoga #[ID]</div>
<div style="font-size: 50px; font-weight: 500; letter-spacing: -0.03em; line-height: 1">87%</div>
<div style="font-size: 14px; color: #6B6E75">≈ 24 km zasięgu</div>
</div>
<img src="../../rendery/hulajnoga-grafit-bok.png" alt="Hulajnoga w wariancie Grafit, widok z boku" style="width: 140px; height: 112px; object-fit: contain; display: block; flex-shrink: 0">
</div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #16181D; padding-top: 16px; border-top: 1px solid #E3E3DE">
<span>120 m · 2 min pieszo</span>
<span style="font-weight: 500">[CENA] zł/min</span>
</div>
<button type="button" style="height: 56px; border: none; border-radius: 28px; background: #2B3FF5; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">Skanuj i jedź</button>
</div>
</div>
</body>
</html>
