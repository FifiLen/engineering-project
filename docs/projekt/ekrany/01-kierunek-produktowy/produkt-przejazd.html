<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Produktowy – przejazd</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEFEC; color: #16181D; font-family: Inter, system-ui, sans-serif">
<svg viewBox="0 0 390 500" width="390" height="500" style="position: absolute; left: 0; top: 0; display: block" role="img" aria-label="Mapa z trasą trwającego przejazdu">
<rect x="0" y="0" width="390" height="500" fill="#EFEFEC"></rect>
<rect x="232" y="60" width="140" height="150" rx="16" fill="#E5E8E1"></rect>
<path d="M-10 420 C 110 380 230 470 400 430" stroke="#DFE3E8" stroke-width="30" fill="none"></path>
<path d="M0 60 L390 36 M262 0 L292 500 M42 0 L58 500 M0 300 L390 270" stroke="#FAFAF8" stroke-width="5" fill="none"></path>
<path d="M0 180 L390 146 M124 0 L156 500" stroke="#FFFFFF" stroke-width="10" fill="none"></path>
<path d="M70 360 L60 250 L140 172 L146 120 L280 104" stroke="#2B3FF5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="70" cy="360" r="6" fill="#FFFFFF" stroke="#16181D" stroke-width="2.5"></circle>
<circle cx="280" cy="104" r="22" fill="#2B3FF5" fill-opacity="0.16"></circle>
<circle cx="280" cy="104" r="10" fill="#2B3FF5" stroke="#FFFFFF" stroke-width="3"></circle>
</svg>
<div style="position: absolute; left: 16px; top: 20px; height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(246,246,243,0.8); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 6px 24px rgba(22,24,29,0.10); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #2B3FF5"></span>Jazda dozwolona
</div>
<div style="position: absolute; right: 16px; top: 20px; height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(246,246,243,0.8); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 6px 24px rgba(22,24,29,0.10); display: flex; align-items: center; font-size: 14px; font-weight: 500">82%</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 384px; box-sizing: border-box; background: #F6F6F3; border-radius: 32px 32px 0 0; padding: 32px 24px 32px; display: flex; flex-direction: column">
<div style="font-size: 13px; font-weight: 500; color: #6B6E75; text-align: center">Czas przejazdu</div>
<div style="font-size: 72px; font-weight: 500; letter-spacing: -0.035em; line-height: 1; text-align: center; margin-top: 6px">12:48</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; margin-top: 28px">
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 20px; font-weight: 500; letter-spacing: -0.015em">2,4 km</div><div style="font-size: 13px; color: #6B6E75">dystans</div></div>
<div style="display: flex; flex-direction: column; gap: 2px; border-left: 1px solid #E3E3DE; border-right: 1px solid #E3E3DE"><div style="font-size: 20px; font-weight: 500; letter-spacing: -0.015em">14 km/h</div><div style="font-size: 13px; color: #6B6E75">prędkość</div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 20px; font-weight: 500; letter-spacing: -0.015em">[KOSZT]</div><div style="font-size: 13px; color: #6B6E75">zł</div></div>
</div>
<div style="flex-grow: 1"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" style="height: 56px; border: none; border-radius: 28px; background: #E3E3DE; color: #16181D; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600">Pauza</button>
<button type="button" style="height: 56px; border: none; border-radius: 28px; background: #16181D; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600">Zakończ</button>
</div>
</div>
</div>
</body>
</html>
