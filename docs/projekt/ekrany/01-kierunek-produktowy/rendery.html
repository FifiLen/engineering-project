<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Rendery hulajnogi</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 1280×1060 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 1280px; height: 1060px; box-sizing: border-box; padding: 56px 64px; background: #F6F6F3; color: #16181D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em">[nazwa]</div>
<div style="font-size: 15px; color: #6B6E75">Rendery koncepcyjne</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<img src="../../rendery/hulajnoga-grafit-trzy.png" alt="Wariant Grafit, widok trzy czwarte" style="width: 100%; height: 400px; object-fit: contain; display: block">
<figcaption style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Grafit</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<img src="../../rendery/hulajnoga-beton-trzy.png" alt="Wariant Beton, widok trzy czwarte" style="width: 100%; height: 400px; object-fit: contain; display: block">
<figcaption style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Beton</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<img src="../../rendery/hulajnoga-kobalt-trzy.png" alt="Wariant Kobalt, widok trzy czwarte" style="width: 100%; height: 400px; object-fit: contain; display: block">
<figcaption style="font-size: 20px; font-weight: 500; letter-spacing: -0.01em">Kobalt</figcaption>
</figure>
</div>
<div style="height: 1px; background: #E3E3DE"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<img src="../../rendery/hulajnoga-grafit-bok.png" alt="Wariant Grafit, profil" style="width: 100%; height: 330px; object-fit: contain; display: block">
<figcaption style="font-size: 15px; color: #6B6E75">Profil</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px">
<img src="../../rendery/hulajnoga-grafit-przod.png" alt="Wariant Grafit, przód" style="width: 100%; height: 330px; object-fit: contain; display: block">
<figcaption style="font-size: 15px; color: #6B6E75">Przód</figcaption>
</figure>
</div>
</div>
</body>
</html>
