<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Rejestracja – kod SMS</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 32px; background: #F6F6F3; color: #16181D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" aria-label="Wróć" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" role="img" aria-label="Krok 2 z 3">
<div style="height: 4px; border-radius: 2px; background: #2B3FF5"></div>
<div style="height: 4px; border-radius: 2px; background: #2B3FF5"></div>
<div style="height: 4px; border-radius: 2px; background: #E3E3DE"></div>
</div>
</div>
<h1 style="margin: 36px 0 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1">Wpisz kod z SMS-a</h1>
<p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #6B6E75">Wysłaliśmy go na numer +48 512 345 678. <a href="#" style="font-weight: 500">Zmień</a></p>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 32px" role="group" aria-label="Kod weryfikacyjny">
<div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E3DE; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500">4</div>
<div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E3DE; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500">8</div>
<div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E3DE; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500">2</div>
<div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E3DE; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500">1</div>
<div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1.5px solid #2B3FF5; display: flex; align-items: center; justify-content: center"><span style="width: 2px; height: 28px; background: #2B3FF5; border-radius: 1px"></span></div>
<div style="height: 64px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E3DE"></div>
</div>
<div style="margin-top: 20px; font-size: 15px; color: #6B6E75">Możesz poprosić o nowy kod za 0:42</div>
<div style="flex-grow: 1"></div>
<button type="button" disabled style="height: 56px; border: none; border-radius: 28px; background: #2B3FF5; opacity: 0.35; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600">Potwierdź</button>
</div>
</body>
</html>
