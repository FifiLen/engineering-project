<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Podsumowanie przejazdu</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EFEFEC; color: #16181D; font-family: Inter, system-ui, sans-serif">
<svg viewBox="0 0 390 300" width="390" height="300" style="position: absolute; left: 0; top: 0; display: block" role="img" aria-label="Mapa z trasą zakończonego przejazdu">
<rect x="0" y="0" width="390" height="300" fill="#EFEFEC"></rect>
<rect x="240" y="30" width="130" height="110" rx="16" fill="#E5E8E1"></rect>
<path d="M0 50 L390 30 M262 0 L284 300 M42 0 L54 300 M0 220 L390 196" stroke="#FAFAF8" stroke-width="5" fill="none"></path>
<path d="M0 140 L390 112 M124 0 L148 300" stroke="#FFFFFF" stroke-width="10" fill="none"></path>
<path d="M70 236 L62 170 L134 138 L140 96 L300 80" stroke="#2B3FF5" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="70" cy="236" r="6" fill="#FFFFFF" stroke="#16181D" stroke-width="2.5"></circle>
<circle cx="300" cy="80" r="9" fill="#16181D" stroke="#FFFFFF" stroke-width="3"></circle>
</svg>
<div style="position: absolute; left: 0; right: 0; top: 256px; bottom: 0; background: #F6F6F3; border-radius: 32px 32px 0 0; padding: 24px 24px 32px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 44px; height: 44px; border-radius: 22px; background: #2B3FF5; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Przejazd zakończony</h1>
<div style="font-size: 14px; color: #6B6E75">Dziś, 14:32</div>
</div>
</div>
<div style="margin-top: 22px; font-size: 46px; font-weight: 500; letter-spacing: -0.035em; line-height: 1">[KOSZT] zł</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 22px">
<div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 18px; font-weight: 500; letter-spacing: -0.015em">12:48</div><div style="font-size: 13px; color: #6B6E75">czas</div></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-left: 16px; border-left: 1px solid #E3E3DE"><div style="font-size: 18px; font-weight: 500; letter-spacing: -0.015em">2,4 km</div><div style="font-size: 13px; color: #6B6E75">dystans</div></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding-left: 16px; border-left: 1px solid #E3E3DE"><div style="font-size: 18px; font-weight: 500; letter-spacing: -0.015em">11 km/h</div><div style="font-size: 13px; color: #6B6E75">średnio</div></div>
</div>
<div style="margin-top: 22px; display: flex; flex-direction: column; font-size: 15px">
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #E3E3DE"><span style="color: #6B6E75">Odblokowanie</span><span>[CENA] zł</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #E3E3DE"><span style="color: #6B6E75">Jazda, 13 min</span><span>[KWOTA] zł</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #E3E3DE; border-bottom: 1px solid #E3E3DE"><span style="color: #6B6E75">Zapłacono z</span><span>Portfel</span></div>
</div>
<div style="margin-top: 16px; display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 12px; background: #E3E3DE; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="../../rendery/hulajnoga-grafit-bok.png" alt="" style="width: 40px; height: 40px; object-fit: contain"></div>
<div style="flex-grow: 1; font-size: 15px">Zdjęcie parkowania dodane</div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B3FF5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
</div>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 56px; border: none; border-radius: 28px; background: #16181D; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600">Gotowe</button>
</div>
</div>
</body>
</html>
