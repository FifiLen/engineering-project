<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Portfel</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 28px; background: #F6F6F3; color: #16181D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 14px">
<button type="button" aria-label="Wróć" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">Portfel</h1>
</div>
<div style="background: #16181D; color: #F6F6F3; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 14px; color: #A3A6AD">Saldo</div>
<div style="font-size: 44px; font-weight: 500; letter-spacing: -0.035em; line-height: 1">[SALDO] zł</div>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 44px; border: 1px solid #3A3E46; border-radius: 22px; background: transparent; color: #F6F6F3; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500">20 zł</button>
<button type="button" style="flex-grow: 1; height: 44px; border: 1px solid #F6F6F3; border-radius: 22px; background: #F6F6F3; color: #16181D; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600">50 zł</button>
<button type="button" style="flex-grow: 1; height: 44px; border: 1px solid #3A3E46; border-radius: 22px; background: transparent; color: #F6F6F3; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500">100 zł</button>
</div>
<button type="button" style="height: 52px; border: none; border-radius: 26px; background: #2B3FF5; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">Doładuj 50 zł</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 4px; font-size: 17px; font-weight: 600">Metoda płatności</h2>
<div style="background: #FFFFFF; border-radius: 20px; border: 1px solid #E3E3DE; overflow: hidden">
<div style="display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 56px">
<div style="width: 36px; height: 24px; border-radius: 5px; background: #16181D; flex-shrink: 0"></div>
<div style="flex-grow: 1; font-size: 15px">Karta •••• [0000]</div>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 6px solid #2B3FF5; box-sizing: border-box" aria-label="Wybrana"></span>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 56px; border-top: 1px solid #E3E3DE">
<div style="width: 36px; height: 24px; border-radius: 5px; background: #E3E3DE; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">BLIK</div>
<div style="flex-grow: 1; font-size: 15px">BLIK</div>
<span style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid #B9B9B2; box-sizing: border-box"></span>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 0 16px; height: 56px; border-top: 1px solid #E3E3DE; color: #2B3FF5">
<div style="width: 36px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></div>
<div style="font-size: 15px; font-weight: 500">Dodaj metodę płatności</div>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0 0 4px; font-size: 17px; font-weight: 600">Historia</h2>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #E3E3DE">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Przejazd, 2,4 km</span><span style="font-size: 13px; color: #6B6E75">Dziś, 14:32</span></div>
<span style="font-size: 15px">−[KWOTA] zł</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #E3E3DE">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Doładowanie</span><span style="font-size: 13px; color: #6B6E75">Wczoraj, 19:05</span></div>
<span style="font-size: 15px; color: #2B3FF5">+50,00 zł</span>
</div>
</div>
</div>
</body>
</html>
