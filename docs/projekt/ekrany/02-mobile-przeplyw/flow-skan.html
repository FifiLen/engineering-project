<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Skanowanie kodu</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#8A97FF}a:hover{color:#B3BCFF}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A2D33; color: #F6F6F3; font-family: Inter, system-ui, sans-serif">
<div style="position: absolute; left: -40px; top: 120px; width: 300px; height: 520px; border-radius: 60px; background: #3A3E46; filter: blur(30px)"></div>
<div style="position: absolute; right: -60px; top: 260px; width: 260px; height: 300px; border-radius: 80px; background: #474B53; filter: blur(40px)"></div>
<div style="position: absolute; left: 70px; top: 270px; width: 250px; height: 250px; border-radius: 32px; box-shadow: 0 0 0 1200px rgba(10,11,14,0.55)"></div>
<div style="position: absolute; left: 135px; top: 335px; width: 120px; height: 120px; border-radius: 14px; background: #F6F6F3; transform: rotate(-6deg); display: flex; align-items: center; justify-content: center">
<svg width="92" height="92" viewBox="0 0 23 23" aria-hidden="true" shape-rendering="crispEdges"><g fill="#16181D"><rect x="0" y="0" width="7" height="7"></rect><rect x="16" y="0" width="7" height="7"></rect><rect x="0" y="16" width="7" height="7"></rect></g><g fill="#F6F6F3"><rect x="1" y="1" width="5" height="5"></rect><rect x="17" y="1" width="5" height="5"></rect><rect x="1" y="17" width="5" height="5"></rect></g><g fill="#16181D"><rect x="2" y="2" width="3" height="3"></rect><rect x="18" y="2" width="3" height="3"></rect><rect x="2" y="18" width="3" height="3"></rect><rect x="9" y="1" width="2" height="2"></rect><rect x="12" y="3" width="2" height="1"></rect><rect x="9" y="5" width="1" height="3"></rect><rect x="11" y="8" width="3" height="2"></rect><rect x="1" y="9" width="3" height="1"></rect><rect x="5" y="10" width="2" height="2"></rect><rect x="15" y="9" width="2" height="2"></rect><rect x="19" y="10" width="3" height="2"></rect><rect x="8" y="12" width="2" height="3"></rect><rect x="12" y="13" width="3" height="1"></rect><rect x="17" y="14" width="2" height="3"></rect><rect x="9" y="17" width="3" height="2"></rect><rect x="13" y="16" width="2" height="2"></rect><rect x="14" y="19" width="3" height="3"></rect><rect x="20" y="18" width="2" height="2"></rect><rect x="10" y="20" width="2" height="2"></rect><rect x="3" y="12" width="1" height="3"></rect></g></svg>
</div>
<div style="position: absolute; left: 70px; top: 270px; width: 250px; height: 250px" aria-hidden="true">
<div style="position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-left: 4px solid #F6F6F3; border-top: 4px solid #F6F6F3; border-top-left-radius: 32px"></div>
<div style="position: absolute; right: 0; top: 0; width: 44px; height: 44px; border-right: 4px solid #F6F6F3; border-top: 4px solid #F6F6F3; border-top-right-radius: 32px"></div>
<div style="position: absolute; left: 0; bottom: 0; width: 44px; height: 44px; border-left: 4px solid #F6F6F3; border-bottom: 4px solid #F6F6F3; border-bottom-left-radius: 32px"></div>
<div style="position: absolute; right: 0; bottom: 0; width: 44px; height: 44px; border-right: 4px solid #F6F6F3; border-bottom: 4px solid #F6F6F3; border-bottom-right-radius: 32px"></div>
<div style="position: absolute; left: 22px; right: 22px; top: 150px; height: 3px; border-radius: 2px; background: #2B3FF5; box-shadow: 0 0 16px #2B3FF5"></div>
</div>
<div style="position: absolute; left: 16px; right: 16px; top: 20px; display: flex; justify-content: space-between">
<button type="button" aria-label="Zamknij skaner" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: rgba(31,34,41,0.6); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<button type="button" aria-label="Włącz latarkę" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.12); background: rgba(31,34,41,0.6); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F6F6F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1 5H9L8 3z"></path><path d="M9 8l1 13h4l1-13"></path><path d="M12 12v3"></path></svg></button>
</div>
<div style="position: absolute; left: 24px; right: 24px; top: 140px; text-align: center; display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Zeskanuj kod QR</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #C9CBD0">Znajdziesz go na kierownicy hulajnogi.</p>
</div>
<div style="position: absolute; left: 12px; right: 12px; bottom: 12px; border-radius: 28px; background: rgba(31,34,41,0.72); -webkit-backdrop-filter: blur(28px) saturate(160%); backdrop-filter: blur(28px) saturate(160%); border: 1px solid rgba(255,255,255,0.1); padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 15px; color: #C9CBD0; text-align: center">Kod jest zniszczony albo nieczytelny?</div>
<button type="button" style="height: 54px; border: none; border-radius: 27px; background: #F6F6F3; color: #16181D; font-family: Inter, sans-serif; font-size: 16px; font-weight: 600">Wpisz numer hulajnogi</button>
</div>
</div>
</body>
</html>
