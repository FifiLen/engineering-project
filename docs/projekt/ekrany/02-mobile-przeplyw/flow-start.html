<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Start</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; background: #F6F6F3; color: #16181D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em">[nazwa]</div>
<div style="height: 400px; margin-top: 12px; display: flex; align-items: center; justify-content: center">
<img src="../../rendery/hulajnoga-grafit-trzy.png" alt="Hulajnoga w wariancie Grafit" style="height: 390px; width: 100%; object-fit: contain; display: block">
</div>
<h1 style="margin: 16px 0 0; font-size: 38px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.08">Hulajnoga zawsze blisko.</h1>
<p style="margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #6B6E75">Znajdź ją na mapie, zeskanuj kod i ruszaj.</p>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" style="height: 56px; border: none; border-radius: 28px; background: #2B3FF5; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600">Utwórz konto</button>
<button type="button" style="height: 56px; border: none; border-radius: 28px; background: #E3E3DE; color: #16181D; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600">Zaloguj się</button>
</div>
</div>
</body>
</html>
