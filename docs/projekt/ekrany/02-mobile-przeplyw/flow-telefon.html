<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Rejestracja – telefon</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px 32px; background: #F6F6F3; color: #16181D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 16px">
<button type="button" aria-label="Wróć" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px" role="img" aria-label="Krok 1 z 3">
<div style="height: 4px; border-radius: 2px; background: #2B3FF5"></div>
<div style="height: 4px; border-radius: 2px; background: #E3E3DE"></div>
<div style="height: 4px; border-radius: 2px; background: #E3E3DE"></div>
</div>
</div>
<h1 style="margin: 36px 0 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1">Podaj numer telefonu</h1>
<p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #6B6E75">Wyślemy SMS z kodem, żeby potwierdzić, że to Ty.</p>
<div style="display: flex; gap: 10px; margin-top: 28px">
<button type="button" aria-label="Kierunkowy kraju: Polska +48" style="height: 60px; padding: 0 16px; border-radius: 16px; border: 1px solid #E3E3DE; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; color: #16181D; display: flex; align-items: center; gap: 6px">+48<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6E75" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<label style="flex-grow: 1; height: 60px; border-radius: 16px; border: 1.5px solid #2B3FF5; background: #FFFFFF; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; box-sizing: border-box">
<span style="font-size: 12px; color: #6B6E75">Numer telefonu</span>
<input type="tel" value="512 345 678" style="border: none; outline: none; padding: 0; background: transparent; font-family: Inter, sans-serif; font-size: 18px; font-weight: 500; color: #16181D; letter-spacing: 0.02em">
</label>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin-top: 28px; color: #6B6E75; font-size: 14px">
<div style="height: 1px; flex-grow: 1; background: #E3E3DE"></div>lub<div style="height: 1px; flex-grow: 1; background: #E3E3DE"></div>
</div>
<button type="button" style="margin-top: 20px; height: 52px; border: 1px solid #E3E3DE; border-radius: 26px; background: #FFFFFF; color: #16181D; font-family: Inter, sans-serif; font-size: 16px; font-weight: 500">Użyj adresu e-mail</button>
<div style="flex-grow: 1"></div>
<label style="display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: #16181D; margin-bottom: 20px">
<span style="width: 22px; height: 22px; border-radius: 7px; background: #2B3FF5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<span>Akceptuję <a href="#">Regulamin</a> i <a href="#">Politykę prywatności</a>.</span>
</label>
<button type="button" style="height: 56px; border: none; border-radius: 28px; background: #2B3FF5; color: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600">Wyślij kod</button>
</div>
</body>
</html>
