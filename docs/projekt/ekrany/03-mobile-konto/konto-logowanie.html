<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Logowanie</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; background: #F6F6F3; color: #16181D; box-sizing: border-box; padding: 20px 24px 32px; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 14px"><button type="button" aria-label="Wróć" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><div style="flex-grow: 1"></div></div><h1 style="margin: 36px 0 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.12">Zaloguj się</h1><p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #6B6E75">Podaj numer, na który zakładałeś konto. Wyślemy SMS z kodem.</p><div style="display: flex; gap: 10px; margin-top: 28px"><button type="button" aria-label="Kierunkowy kraju: Polska +48" style="height: 60px; padding: 0 16px; border-radius: 16px; border: 1px solid #E3E3DE; background: #FFFFFF; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; color: #16181D">+48</button><div style="flex-grow: 1"><label style="height: 60px; border-radius: 16px; border: 1.5px solid #2B3FF5; background: #FFFFFF; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; box-sizing: border-box"><span style="font-size: 12px; color: #6B6E75">Numer telefonu</span><input type="text" value="512 345 678" style="border: none; outline: none; padding: 0; background: transparent; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; color: #16181D"></label></div></div><button type="button" style="margin-top: 20px; height: 44px; border: none; background: transparent; font-family: Inter, sans-serif; font-size: 15px; font-weight: 500; color: #2B3FF5; align-self: flex-start; padding: 0">Zaloguj się adresem e-mail</button><div style="flex-grow: 1"></div><button type="button" style="height: 56px; border-radius: 28px; background: #2B3FF5; color: #FFFFFF; border: none; padding: 0 20px; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; ">Wyślij kod</button><div style="text-align: center; font-size: 15px; color: #6B6E75; margin-top: 18px">Nie masz konta? <a href="#" style="font-weight: 500; color: #2B3FF5">Utwórz je</a></div>
</div>
</body>
</html>
