<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Odblokowywanie</title>
<!-- Eksport z kanwy „Moodboardy – system hulajnóg” (claude.ai). Plansza 390×844 px. Kolor akcji: #2B3FF5. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2B3FF5}a:hover{color:#1A2AC0}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; background: #F6F6F3; color: #16181D; box-sizing: border-box; padding: 20px 24px 32px; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 14px"><button type="button" aria-label="Anuluj odblokowywanie" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E3E3DE; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button><div style="flex-grow: 1"></div></div><div style="height: 330px; margin-top: 8px; display: flex; align-items: center; justify-content: center"><img src="../../rendery/hulajnoga-grafit-trzy.png" alt="Odblokowywana hulajnoga" style="height: 320px; width: 100%; object-fit: contain"></div><h1 style="margin: 8px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.12">Odblokowuję hulajnogę…</h1><p style="margin: 10px 0 0; font-size: 16px; line-height: 1.5; color: #6B6E75">To potrwa kilka sekund. Zostań przy hulajnodze.</p><div style="display: flex; flex-direction: column; gap: 18px; margin-top: 28px"><div style="display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 400; color: #16181D"><span style="width: 26px; height: 26px; border-radius: 13px; background: #2B3FF5; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>Połączono z hulajnogą #[ID]</div><div style="display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 600; color: #16181D"><span style="width: 26px; height: 26px; border-radius: 13px; border: 3px solid #D5D5CF; border-top-color: #2B3FF5; box-sizing: border-box; flex-shrink: 0; transform: rotate(45deg)"></span>Zwalniam blokadę</div><div style="display: flex; align-items: center; gap: 14px; font-size: 16px; font-weight: 400; color: #6B6E75"><span style="width: 26px; height: 26px; border-radius: 13px; border: 1.5px solid #D5D5CF; box-sizing: border-box; flex-shrink: 0"></span>Włączam światła i wyświetlacz</div></div><div style="flex-grow: 1"></div><div style="font-size: 14px; line-height: 1.45; color: #6B6E75; text-align: center">Opłata za przejazd zacznie się naliczać dopiero po odblokowaniu.</div>
</div>
</body>
</html>
