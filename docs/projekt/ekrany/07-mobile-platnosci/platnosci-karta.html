<div style="width: 390px; height: 844px; background: #F6F6F3; color: #16181D; box-sizing: border-box; padding: 20px 24px 32px; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif">

e: 12px; color: #6B6E75">Ważna do</span><input type="text" value="MM/RR" style="border: none; outline: none; padding: 0; background: transparent; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; color: #6B6E75"></label><label style="height: 60px; border-radius: 16px; border: 1px solid #E3E3DE; background: #FFFFFF; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; box-sizing: border-box"><span style="font-size: 12px; color: #6B6E75">CVC</span><input type="text" value="•••" style="border: none; outline: none; padding: 0; background: transparent; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; color: #6B6E75"></label></div><label style="height: 60px; border-radius: 16px; border: 1px solid #E3E3DE; background: #FFFFFF; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; box-sizing: border-box"><span style="font-size: 12px; color: #6B6E75">Imię i nazwisko na karcie</span><input type="text" value="Anna" style="border: none; outline: none; padding: 0; background: transparent; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; color: #16181D"></label></div><div style="display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; font-size: 14px; line-height: 1.45; color: #6B6E75"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6E75" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 018 0v3"></path></svg><span>Dane karty trafiają bezpośrednio do operatora płatności. Aplikacja nie przechowuje pełnego numeru karty.</span></div><div style="flex-grow: 1"></div><button type="button" style="height: 56px; border-radius: 28px; background: #2B3FF5; color: #FFFFFF; border: none; padding: 0 20px; font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; ">Dodaj kartę</button>
