<div style="width: 1440px; height: 900px; display: flex; background: #F6F6F3; color: #16181D; font-family: Inter, system-ui, sans-serif">
<div style="width: 560px; background: #2B3FF5; color: #FFFFFF; padding: 56px; box-sizing: border-box; display: flex; flex-direction: column"><div style="display: flex; align-items: center; gap: 12px"><div style="width: 40px; height: 40px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="32" height="32" viewBox="0 0 1024 1024" fill="none" stroke="#2B3FF5" stroke-width="72" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="314" cy="668" r="88"></circle><circle cx="710" cy="668" r="88"></circle><path d="M402 668 H622M710 668 L614 268M534 268 H684"></path></svg></div><span style="font-size: 20px; font-weight: 600">[nazwa]</span></div><div style="flex-grow: 1"></div><div style="font-size: 44px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.08">Panel operatora floty</div><div style="font-size: 17px; line-height: 1.5; margin-top: 16px; color: #DDE1FF">Flota, przejazdy, strefy i zgłoszenia w jednym miejscu, na żywo.</div></div><div style="flex-grow: 1; display: flex; align-items: center; justify-content: center"><div style="width: 400px; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">Zaloguj się</h1><p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #6B6E75">Dostęp mają tylko konta pracowników operatora.</p><div style="display: flex; flex-direction: column; gap: 12px; margin-top: 28px"><label style="height: 60px; border-radius: 16px; border: 1px solid #E3E3DE; background: #FFFFFF; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; box-sizing: border-box"><span style="font-size: 12px; color: #6B6E75">E-mail służbowy</span><input type="text" value="marta.w@operator.pl" style="border: none; outline: none; padding: 0; background: transparent; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; color: #16181D"></label><label style="height: 60px; border-radius: 16px; border: 1.5px solid #2B3FF5; background: #FFFFFF; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; box-sizing: border-box"><span style="font-size: 12px; color: #6B6E75">Hasło</span><input type="text" value="••••••••••" style="border: none; outline: none; padding: 0; background: transparent; font-family: Inter, sans-serif; font-size: 17px; font-weight: 500; color: #16181D"></label></div><label style="display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: 14px"><span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #B9B9B2; box-sizing: border-box"></span>Zapamiętaj to urządzenie</label><div style="margin-top: 24px; display: flex; flex-direction: column"><button type="button" style="height: 52px; border-radius: 26px; background: #2B3FF5; color: #FFFFFF; border: none; padding: 0 20px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; ">Zaloguj się</button></div><div style="font-size: 13px; color: #6B6E75; margin-top: 16px; line-height: 1.45">Po zalogowaniu poprosimy o kod z aplikacji uwierzytelniającej.</div></div></div>
