 rx="14" fill="#FFFFFF" stroke="#E3E3DE" stroke-width="1.5"></rect><text x="920" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#16181D">Baza danych</text><text x="920" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#6B6E75"></text><rect x="1228" y="20" width="184" height="58" rx="14" fill="#FFFFFF" stroke="#B9B9B2" stroke-width="1.5" stroke-dasharray="5 4"></rect><text x="1320" y="45" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#16181D">Dostawca SMS</text><text x="1320" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#6B6E75"></text><line x1="120" y1="149" x2="516" y2="149" stroke="#16181D" stroke-width="1.6" marker-end="url(#ar)"></line><circle cx="136" cy="136" r="10" fill="#2B3FF5"></circle><text x="136" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">1</text><text x="340" y="140" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#16181D">POST /auth/otp {phone}</text><path d="M520 175 H554 V199 H524" fill="none" stroke="#16181D" stroke-width="1.6" marker-end="url(#ar)"></path><circle cx="572" cy="183" r="10" fill="#2B3FF5"></circle><text x="572" y="187" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">2</text><text x="590" y="187" text-anchor="start" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">limit prób na numer i IP</text><line x1="520" y1="250" x2="916" y2="250" stroke="#16181D" stroke-width="1.6" marker-end="url(#ar)"></line><circle cx="536" cy="237" r="10" fill="#2B3FF5"></circle><text x="536" y="241" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">3</text><text x="740" y="241" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">hash kodu, ważny 5 min</text><line x1="520" y1="297" x2="1316" y2="297" stroke="#16181D" stroke-width="1.6" marker-end="url(#ar)"></line><circle cx="536" cy="284" r="10" fill="#2B3FF5"></circle><text x="536" y="288" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">4</text><text x="940" y="288" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">wyślij kod</text><line x1="1320" y1="344" x2="124" y2="344" stroke="#16181D" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"></line><circle cx="136" cy="331" r="10" fill="#2B3FF5"></circle><text x="136" y="335" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">5</text><text x="740" y="335" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">SMS z kodem</text><line x1="120" y1="391" x2="516" y2="391" stroke="#16181D" stroke-width="1.6" marker-end="url(#ar)"></line><circle cx="136" cy="378" r="10" fill="#2B3FF5"></circle><text x="136" y="382" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">6</text><text x="340" y="382" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#16181D">POST /auth/otp/verify</text><line x1="520" y1="455" x2="916" y2="455" stroke="#16181D" stroke-width="1.6" marker-end="url(#ar)"></line><circle cx="536" cy="442" r="10" fill="#2B3FF5"></circle><text x="536" y="446" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">7</text><text x="740" y="429" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">porównaj hash, utwórz konto,</text><text x="740" y="446" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">jeśli nowe</text><line x1="520" y1="519" x2="124" y2="519" stroke="#16181D" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"></line><circle cx="136" cy="506" r="10" fill="#2B3FF5"></circle><text x="136" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">8</text><text x="340" y="493" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">access 15 min, refresh 30 dni,</text><text x="340" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">isNew</text><line x1="40" y1="561" x2="1400" y2="561" stroke="#B9B9B2" stroke-width="1.2" stroke-dasharray="4 5"></line><rect x="40" y="547" width="100" height="28" rx="14" fill="#F6F6F3" stroke="#B9B9B2"></rect><text x="90" y="566" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16181D">Nowe konto</text><line x1="120" y1="602" x2="516" y2="602" stroke="#16181D" stroke-width="1.6" marker-end="url(#ar)"></line><circle cx="136" cy="589" r="10" fill="#2B3FF5"></circle><text x="136" y="593" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">9</text><text x="340" y="593" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#16181D">PATCH /me {imię, e-mail, zgody}</text><line x1="40" y1="644" x2="1400" y2="644" stroke="#B9B9B2" stroke-width="1.2" stroke-dasharray="4 5"></line><rect x="40" y="630" width="215" height="28" rx="14" fill="#F6F6F3" stroke="#B9B9B2"></rect><text x="148" y="649" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#16181D">Wygaśnięcie tokenu dostępu</text><line x1="120" y1="685" x2="516" y2="685" stroke="#16181D" stroke-width="1.6" marker-end="url(#ar)"></line><circle cx="136" cy="672" r="10" fill="#2B3FF5"></circle><text x="136" y="676" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">10</text><text x="340" y="676" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#16181D">POST /auth/refresh</text><line x1="520" y1="732" x2="124" y2="732" stroke="#16181D" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ar)"></line><circle cx="136" cy="719" r="10" fill="#2B3FF5"></circle><text x="136" y="723" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">11</text><text x="340" y="723" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#16181D">nowa para tokenów</text></svg>
