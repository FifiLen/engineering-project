<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Konto zablokowane</title>
<!-- Aplikacja mobilna, konto i dostęp (ADR 0019, 0027). Plansza w stylu 03-mobile-konto. Powód to kategoria wybrana przez operatora; notatka operatora nie trafia do klienta. Dane kontaktowe z modułu treści. Plansza 390×844 px, wartości z docs/projekt/tokens.json.
     Dane przykładowe. Etykiety pochodzą z plików tłumaczeń (ADR 0032), treści dokumentów z bazy (ADR 0027). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.app{width:1440px;height:900px;display:flex;background:#F6F6F3;color:#16181D;overflow:hidden;font-family:Inter,system-ui,sans-serif;position:relative}
nav.side{width:232px;flex-shrink:0;background:#FFFFFF;border-right:1px solid #E3E3DE;display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:#2B3FF5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-name{font-size:15px;font-weight:600} .brand-sub{font-size:12px;color:#6B6E75}
.nav-group{font-size:11px;font-weight:600;color:#6B6E75;text-transform:uppercase;letter-spacing:.04em;padding:12px 12px 4px}
.nav-item{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:12px;text-decoration:none;font-size:14px;color:#16181D;font-weight:500}
.nav-item.active{background:#EEF0FE;color:#2B3FF5;font-weight:600}
.nav-badge{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:#C62F2F;color:#FFFFFF;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid #E3E3DE}
.avatar{width:32px;height:32px;border-radius:16px;background:#16181D;color:#F6F6F3;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
main{flex-grow:1;min-width:0;display:flex;flex-direction:column;padding:28px 32px;gap:16px;position:relative;overflow:hidden}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-0.025em}
.sub{font-size:14px;color:#6B6E75}
.btn{height:36px;padding:0 14px;border-radius:18px;background:#FFFFFF;color:#16181D;border:1px solid #E3E3DE;font-family:Inter,sans-serif;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:#2B3FF5;color:#FFFFFF;border:none}
.btn.dark{background:#16181D;color:#F6F6F3;border:none}
.btn.danger{color:#C62F2F;border-color:#F0C4C4}
.chip{height:36px;padding:0 12px;border-radius:17px;background:#FFFFFF;border:1px solid #E3E3DE;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:#16181D;color:#F6F6F3;border-color:#16181D}
.chip .n{opacity:.6;font-weight:500}
.search{width:280px;white-space:nowrap;height:36px;border-radius:18px;background:#FFFFFF;border:1px solid #E3E3DE;display:inline-flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;color:#6B6E75}
.tag{height:30px;padding:0 6px 0 12px;border-radius:15px;background:#EEF0FE;color:#2B3FF5;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.tag b{font-weight:600}
.tag .x{width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.link{font-size:13px;font-weight:600;color:#2B3FF5;text-decoration:none}
.card{background:#FFFFFF;border:1px solid #E3E3DE;border-radius:20px;padding:12px}
.row{display:grid;gap:12px;align-items:center;height:50px;padding:0 16px;border-top:1px solid #E3E3DE;font-size:14px}
.row > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.head{height:auto;border-top:none;padding:0 16px 10px;font-size:12px;font-weight:600;color:#6B6E75}
.row.selected{background:#EEF0FE}
.th-sort{display:inline-flex;align-items:center;gap:4px;color:#16181D}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid #B9B9B2;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.cb.on{background:#2B3FF5;border-color:#2B3FF5}
.cb.mixed{background:#2B3FF5;border-color:#2B3FF5}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;background:#EDEDE9;color:#16181D}
.pill.accent{background:#EEF0FE;color:#2B3FF5} .pill.muted{color:#6B6E75}
.pill.warn{background:#FFF1DB;color:#8F5500} .pill.danger{background:#FBE3E3;color:#C62F2F}
.overdue{color:#C62F2F;font-weight:500}
.mono{font-weight:600}
.muted{color:#6B6E75}
.pager{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 0;border-top:1px solid #E3E3DE;font-size:13px;color:#6B6E75}
.page{width:36px;height:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#16181D}
.page.on{background:#16181D;color:#F6F6F3}
.select{height:36px;padding:0 12px 0 14px;border-radius:18px;background:#FFFFFF;border:1px solid #E3E3DE;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#16181D}
.bulk{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);height:56px;padding:0 10px 0 20px;border-radius:28px;background:#16181D;color:#F6F6F3;display:flex;align-items:center;gap:6px;box-shadow:0 12px 40px rgba(22,24,29,0.24);font-size:14px;white-space:nowrap}
.bulk .count{font-weight:600;padding-right:12px;margin-right:4px;border-right:1px solid #3A3D45}
.bulk .act{height:36px;padding:0 14px;border-radius:18px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#F6F6F3}
.bulk .act.danger{color:#FF7A70}
.field{display:flex;flex-direction:column;gap:6px}
.label{font-size:13px;font-weight:600}
.label .opt{font-weight:400;color:#6B6E75}
.input{height:46px;border-radius:14px;border:1px solid #E3E3DE;background:#FFFFFF;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:15px;color:#16181D}
.input.error{border:1.5px solid #C62F2F}
.input .ph{color:#6B6E75}
.hint{font-size:12px;color:#6B6E75}
.err{font-size:12px;color:#C62F2F;font-weight:500;display:flex;align-items:center;gap:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.section-title{font-size:17px;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid #E3E3DE}
.tab{height:40px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#6B6E75;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:#16181D;font-weight:600;border-bottom-color:#16181D}
.tab .n{font-size:12px;font-weight:500;color:#6B6E75}
.iconbtn{width:32px;height:32px;border-radius:16px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.av{width:30px;height:30px;border-radius:15px;background:#EDEDE9;color:#16181D;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.av.dark{background:#16181D;color:#F6F6F3}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0}
.stack > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.small{font-size:12px;color:#6B6E75}
.num{font-weight:500}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 16px;font-size:14px}
.kv dt{color:#6B6E75;margin:0} .kv dd{margin:0;font-weight:500}
.notice{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.45}
.notice.info{background:#EEF0FE;color:#16181D} .notice.warn{background:#FFF1DB;color:#16181D} .notice.danger{background:#FBE3E3;color:#16181D}
.notice .ic{width:28px;height:28px;border-radius:14px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.overlay{position:absolute;inset:0;background:rgba(22,24,29,0.32);display:flex;align-items:center;justify-content:center}
.dialog{width:520px;background:#FFFFFF;border-radius:28px;padding:28px;box-shadow:0 24px 64px rgba(22,24,29,0.28);display:flex;flex-direction:column;gap:18px}
.radio{width:20px;height:20px;border-radius:10px;border:1.5px solid #B9B9B2;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.radio.on{border:6px solid #2B3FF5}
.drawer{position:absolute;top:0;right:0;bottom:0;width:440px;background:#FFFFFF;border-left:1px solid #E3E3DE;box-shadow:-12px 0 40px rgba(22,24,29,0.10);display:flex;flex-direction:column}
.diff-old{background:#FBE3E3;color:#16181D;border-radius:6px;padding:1px 6px;text-decoration:line-through;text-decoration-color:#C62F2F}
.diff-new{background:#E4EFE3;color:#16181D;border-radius:6px;padding:1px 6px}
.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#6B6E75}
.toggle{width:36px;height:22px;border-radius:11px;background:#E3E3DE;position:relative;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:8px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:#2B3FF5} .toggle.on::after{left:17px}
.phone{width:390px;height:844px;background:#F6F6F3;color:#16181D;padding:20px 24px 32px;display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif}
.phone h1{margin:0;font-size:32px;font-weight:600;letter-spacing:-0.03em;line-height:1.12}
.lead{margin:10px 0 0;font-size:16px;line-height:1.5;color:#6B6E75}
.badge{width:64px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:center}
.primary{height:56px;border-radius:28px;background:#2B3FF5;color:#FFFFFF;border:none;font-family:Inter,sans-serif;font-size:17px;font-weight:600;width:100%}
.secondary{height:56px;border-radius:28px;background:#E3E3DE;color:#16181D;border:none;font-family:Inter,sans-serif;font-size:17px;font-weight:600;width:100%}
.group{background:#FFFFFF;border-radius:20px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 16px;font-size:16px}
.grow + .grow{border-top:1px solid #E3E3DE}
.back{width:44px;height:44px;border-radius:22px;border:none;background:#E3E3DE;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.cells{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cell{height:64px;border-radius:16px;background:#FFFFFF;border:1.5px solid #C62F2F;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;color:#6B6E75}
</style>
</head>
<body>
<div class="phone">
<div class="badge" style="background:#FBE3E3;margin-top:40px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C62F2F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg></div>
<h1 style="margin-top:24px">Konto jest zablokowane</h1>
<p class="lead">Powód: zaległa płatność. Do czasu wyjaśnienia nie zarezerwujesz hulajnogi.</p>
<div class="group" style="margin-top:28px">
<div class="grow"><span style="width:32px;height:32px;border-radius:16px;background:#F6F6F3;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M4 7l8 6 8-6"></path></svg></span><span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;padding:9px 0"><span>[e-mail pomocy]</span><span style="font-size:13px;color:#6B6E75">odpowiadamy w ciągu doby</span></span></div>
<div class="grow"><span style="width:32px;height:32px;border-radius:16px;background:#F6F6F3;display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18h2"></path></svg></span><span style="display:flex;flex-direction:column;gap:2px;flex-grow:1;padding:9px 0"><span>[telefon pomocy]</span><span style="font-size:13px;color:#6B6E75">pon.–pt. 8:00–18:00</span></span></div>
</div>
<p style="margin:16px 0 0;font-size:14px;color:#6B6E75;line-height:1.5">Podaj numer telefonu, na który jest założone konto: +48 512 ••• 678.</p>
<div style="flex-grow:1"></div>
<button type="button" class="primary">Napisz do pomocy</button>
<button type="button" class="secondary" style="margin-top:10px">Wyloguj się</button>
</div>
</body>
</html>
