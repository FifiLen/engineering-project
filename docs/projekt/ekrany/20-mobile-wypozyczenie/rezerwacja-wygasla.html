<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Rezerwacja wygasła</title>
<!-- Aplikacja mobilna, wypożyczenie (iteracja 3, pytanie 1; ADR 0013, ADR 0037 o pg-boss). Powrót na mapę po wygaśnięciu rezerwacji (RESERVED → EXPIRED po free_reservation_minutes; zdarzenie z zadania w tle przez Socket.IO). Panel szklany w stylu 08-mobile-stany/stan-brak-lokalizacji, odznaka neutralna (to nie błąd). Hulajnoga #0027 wraca na mapę jako zwykła kropka. „Zarezerwuj ponownie” działa od razu (bez limitu rezerwacji); jeśli ktoś zdążył ją zająć, aplikacja pokazuje 08-mobile-stany/stan-niedostepna. Gdy aplikacja była zamknięta, ten sam panel pokazuje się przy następnym otwarciu mapy.
     Dane przykładowe: hulajnoga #0027 (numer z bazy w formacie czterocyfrowym jak w panelu i w temacie MQTT), strefa P-01 Rynek z danych startowych Rybnika, klientka Anna. Etykiety pochodzą z pliku tłumaczeń aplikacji (ADR 0032), kwoty i czasy z wersji cennika zapisanej w przejeździe; wartości nieustalone w nawiasach. Plansza 390×844 px, wartości z docs/projekt/tokens.json. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#F6F6F3;color:#16181D;font-family:Inter,system-ui,sans-serif}
.phone.map{background:#EFEFEC}
.phone.camera{background:#2A2D33}
.page{padding:20px 24px 32px;display:flex;flex-direction:column}
.page.list{padding:20px 20px 28px}
.glass{background:rgba(246,246,243,0.84);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.7);box-shadow:0 12px 40px rgba(22,24,29,0.14)}
.topbar{position:absolute;left:16px;right:16px;top:20px;display:flex;gap:10px;align-items:center}
.round{width:44px;height:44px;border-radius:22px;border:none;background:#E3E3DE;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.round.dark{background:#16181D;color:#F6F6F3;font-family:Inter,sans-serif;font-size:15px;font-weight:600}
.round.cam{border:1px solid rgba(255,255,255,0.12);background:rgba(31,34,41,0.6);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.pill{height:40px;padding:0 16px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;border-radius:32px;padding:24px;display:flex;flex-direction:column;gap:16px}
.bottom-sheet{position:absolute;left:0;right:0;bottom:0;background:#F6F6F3;border-radius:32px 32px 0 0;padding:12px 24px 32px;display:flex;flex-direction:column}
.grabber{width:36px;height:5px;border-radius:3px;background:#D5D5CF;align-self:center}
.scrim{position:absolute;inset:0;background:rgba(22,24,29,0.32)}
.btn{height:56px;border-radius:28px;border:none;padding:0 20px;font-family:Inter,sans-serif;font-size:17px;font-weight:600;width:100%;white-space:nowrap}
.btn.primary{background:#2B3FF5;color:#FFFFFF}
.btn.secondary{background:#E3E3DE;color:#16181D}
.btn.dark{background:#16181D;color:#FFFFFF}
.btn.text{height:48px;background:transparent;color:#16181D;font-size:16px}
.btns{display:flex;flex-direction:column;gap:10px}
.btns.split{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.badge{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b48{width:48px;height:48px}
.b64{width:64px;height:64px}
.neutral{background:#E3E3DE} .danger{background:#FBE3E3} .warn{background:#FFF1DB} .accent{background:#EEF0FE}
.alert-title{font-size:19px;font-weight:600;letter-spacing:-0.01em}
.body15{font-size:15px;line-height:1.45;color:#6B6E75}
.muted{color:#6B6E75}
.num{font-weight:500}
h1.screen{margin:0;font-size:32px;font-weight:600;letter-spacing:-0.03em;line-height:1.12}
h1.status{margin:0;font-size:30px;font-weight:600;letter-spacing:-0.03em;line-height:1.12}
h1.heading{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em}
.lead{margin:10px 0 0;font-size:16px;line-height:1.5;color:#6B6E75}
.steps{display:flex;flex-direction:column;gap:18px;margin-top:28px}
.step{display:flex;align-items:center;gap:14px;font-size:16px}
.step .dot{width:26px;height:26px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.dot.done{background:#2B3FF5}
.dot.fail{background:#C62F2F}
.dot.spin{border:3px solid #D5D5CF;border-top-color:#2B3FF5;transform:rotate(45deg)}
.dot.todo{border:1.5px solid #D5D5CF}
.render{display:flex;align-items:center;justify-content:center}
svg{flex-shrink:0}
.render img{width:100%;object-fit:contain;display:block}
.group{background:#FFFFFF;border-radius:20px;border:1px solid #E3E3DE;overflow:hidden}
.grow{display:flex;align-items:center;gap:14px;min-height:54px;padding:0 16px;font-size:16px}
.grow + .grow{border-top:1px solid #E3E3DE}
.field{height:60px;border-radius:16px;border:1px solid #E3E3DE;background:#FFFFFF;display:flex;flex-direction:column;justify-content:center;padding:0 16px}
.field.active{border:1.5px solid #2B3FF5}
.field.readonly{background:#EDEDE9;border-color:#EDEDE9}
.field .label{font-size:12px;color:#6B6E75}
.field .value{font-size:17px;font-weight:500;color:#16181D;display:flex;align-items:center;gap:2px}
.field input{border:none;outline:none;padding:0;background:transparent;font-family:Inter,sans-serif;font-size:17px;font-weight:500;color:#16181D;width:100%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stats > div{display:flex;flex-direction:column;gap:2px}
.stats .v{font-size:18px;font-weight:500;letter-spacing:-0.015em}
.stats .l{font-size:13px;color:#6B6E75}
.lines{display:flex;flex-direction:column;font-size:15px}
.lines > div{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #E3E3DE}
.lines > div:last-child{border-bottom:1px solid #E3E3DE}
.lines .k{color:#6B6E75}
.lines .a{font-weight:500}
.toast{position:absolute;left:16px;right:16px;top:76px;border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500}
</style>
</head>
<body>
<div class="phone map">
<svg viewBox="0 0 390 844" width="390" height="844" style="position:absolute;left:0;top:0;display:block" role="img" aria-label="Mapa okolicy z wolnymi hulajnogami po wygaśnięciu rezerwacji"><rect x="0" y="0" width="390" height="844" fill="#EFEFEC"></rect><rect x="232" y="150" width="140" height="170" rx="16" fill="#E5E8E1"></rect><path d="M-10 560 C 110 520 230 640 400 590" stroke="#DFE3E8" stroke-width="30" fill="none"></path><path d="M0 120 L390 92 M262 0 L300 844 M42 0 L62 844 M0 420 L390 384 M0 760 L390 730" stroke="#FAFAF8" stroke-width="5" fill="none"></path><path d="M0 270 L390 226 M124 0 L166 844 M0 680 L390 640" stroke="#FFFFFF" stroke-width="10" fill="none"></path><rect x="300" y="404" width="62" height="44" rx="10" fill="#2B3FF5" fill-opacity="0.16" stroke="#2B3FF5" stroke-width="1.5"></rect><text x="331" y="432" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#2B3FF5">P</text><circle cx="96" cy="230" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="214" cy="300" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="300" cy="200" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="88" cy="400" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="320" cy="330" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="250" cy="430" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="160" cy="345" r="6" fill="#FFFFFF" stroke="#2B3FF5" stroke-width="3"></circle></svg>
<div class="topbar"><button type="button" class="round dark" aria-label="Profil">A</button><div style="flex-grow:1"></div><button type="button" class="round glass" aria-label="Pokaż moje położenie"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button></div>
<div class="sheet glass">
<div style="display:flex;gap:14px;align-items:center"><div class="badge b48 neutral"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></div><div style="display:flex;flex-direction:column;gap:2px"><span class="alert-title">Rezerwacja wygasła</span><span style="font-size:15px;color:#6B6E75">Hulajnoga #0027</span></div></div>
<div class="body15">Minęło [CZAS] min bezpłatnej rezerwacji, więc zwolniliśmy hulajnogę dla innych. Nie pobraliśmy żadnej opłaty.</div>
<div class="btns"><button type="button" class="btn primary">Zarezerwuj ponownie</button><button type="button" class="btn secondary">Zamknij</button></div>
</div>
</div>
</body>
</html>
