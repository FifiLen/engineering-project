<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Hulajnoga w strefie zakazu</title>
<!-- Aplikacja mobilna, strefy (iteracja 4, pytanie 4; ADR 0043 o bieżących strefach hulajnogi). Wariant 08-mobile-stany/stan-niedostepna dla nowej przyczyny OUT_OF_AREA w UNAVAILABLE_REASONS: hulajnoga stoi w strefie zakazu albo poza obszarem działania (na przykład po zdalnym zakończeniu przez operatora) i czeka na serwis. Odpowiedź SCOOTER_UNAVAILABLE z przyczyną OUT_OF_AREA przychodzi przy rezerwacji albo starcie, czyli po zeskanowaniu kodu QR (tło aparatu jak w stan-niedostepna) albo po wpisaniu numeru (20-mobile-wypozyczenie/skan-numer, ten sam panel). Na mapie takich hulajnóg nie pokazujemy, więc z karty hulajnogi ten stan nie wystąpi.
     Zachowanie: jedna przyczyna obejmuje obie sytuacje (API nie rozróżnia zakazu i obszaru działania), dlatego tekst wymienia obie. Ten sam układ i te same przyciski co pozostałe przyczyny (klucze scooter.unavailable.*): „Pokaż najbliższą wolną” wraca na mapę z zaznaczoną najbliższą wolną hulajnogą, „Skanuj inną” wraca do skanera. Podtytuł z numerem i baterią jak w wariancie LOW_BATTERY. Nowy klucz: scooter.unavailable.reasons.OUT_OF_AREA. Odznaka w kolorze błędu ze znakiem zakazu, jak w komunikacie 22-mobile-strefy/przejazd-zakaz.
     Dane przykładowe: hulajnoga #0027 (numer czterocyfrowy jak w panelu i w temacie MQTT), klientka Anna. Etykiety pochodzą z pliku tłumaczeń aplikacji (ADR 0032). Plansza 390×844 px, wartości z docs/projekt/tokens.json. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#F6F6F3;color:#16181D;font-family:Inter,system-ui,sans-serif}
.phone.map{background:#EFEFEC}
.phone.camera{background:#2A2D33}
.page{padding:20px 20px 32px;display:flex;flex-direction:column}
.glass{background:rgba(246,246,243,0.84);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.7);box-shadow:0 12px 40px rgba(22,24,29,0.14)}
.topbar{position:absolute;left:16px;right:16px;top:20px;display:flex;gap:10px;align-items:center}
.round{width:44px;height:44px;border-radius:22px;border:none;background:#E3E3DE;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.round.small{width:40px;height:40px;border-radius:20px;background:transparent}
.pill{height:40px;padding:0 16px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.banner{position:absolute;left:16px;right:16px;top:20px;border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;border-radius:32px;padding:24px;display:flex;flex-direction:column;gap:16px}
.ride-sheet{position:absolute;left:0;right:0;bottom:0;height:384px;background:#F6F6F3;border-radius:32px 32px 0 0;padding:32px 24px 28px;display:flex;flex-direction:column}
.btn{height:56px;border-radius:28px;border:none;padding:0 20px;font-family:Inter,sans-serif;font-size:17px;font-weight:600;width:100%;white-space:nowrap}
.btn.primary{background:#2B3FF5;color:#FFFFFF}
.btn.secondary{background:#E3E3DE;color:#16181D}
.btn.dark{background:#16181D;color:#FFFFFF}
.btns{display:flex;flex-direction:column;gap:10px}
.btns.split{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.btns.half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.badge{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b44{width:44px;height:44px}
.b48{width:48px;height:48px}
.b56{width:56px;height:56px}
.neutral{background:#E3E3DE} .danger{background:#FBE3E3} .warn{background:#FFF1DB} .accent{background:#EEF0FE}
.chip{display:inline-flex;height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:600;align-items:center}
.chip.danger{background:#FBE3E3;color:#C62F2F}
.b-title{font-size:16px;font-weight:600}
.b-body{font-size:14px;line-height:1.45;color:#6B6E75}
.alert-title{font-size:19px;font-weight:600;letter-spacing:-0.01em}
.body15{font-size:15px;line-height:1.45;color:#6B6E75}
.muted{color:#6B6E75}
.num{font-weight:500}
.label13{font-size:13px;font-weight:500;color:#6B6E75}
.timer{font-size:72px;font-weight:500;letter-spacing:-0.035em;line-height:1;text-align:center;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.stats > div{display:flex;flex-direction:column;gap:2px}
.stats > div:nth-child(2){border-left:1px solid #E3E3DE;border-right:1px solid #E3E3DE}
.stats .v{font-size:20px;font-weight:500;letter-spacing:-0.015em}
.stats .l{font-size:13px;color:#6B6E75}
.group{background:#FFFFFF;border-radius:20px;border:1px solid #E3E3DE;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 16px;font-size:15px}
.grow + .grow{border-top:1px solid #E3E3DE}
.section{font-size:14px;font-weight:600;color:#6B6E75}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E3E3DE}
.row .ico{width:40px;height:40px;border-radius:20px;background:#E3E3DE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .txt{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t{font-size:16px;font-weight:500}
.row .s{font-size:14px;color:#6B6E75}
.row .e{font-size:14px;color:#6B6E75}
svg{flex-shrink:0}
</style>
</head>
<body>
<div class="phone camera">
<div style="position:absolute;inset:0;background:rgba(10,11,14,0.55)"></div>
<div style="position:absolute;left:70px;top:200px;width:250px;height:250px;border-radius:32px;border:2px solid rgba(246,246,243,0.35)"></div>
<div class="sheet glass" role="alert">
<div style="display:flex;gap:14px;align-items:center">
<div class="badge b48 danger"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C62F2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg></div>
<div style="display:flex;flex-direction:column;gap:2px"><span class="alert-title">Tej hulajnogi nie wypożyczysz</span><span style="font-size:15px;color:#6B6E75">#0027, bateria <span class="num">64%</span></span></div>
</div>
<div class="body15">Hulajnoga stoi w strefie zakazu jazdy albo poza obszarem działania, więc nie możemy jej odblokować. Zabierze ją serwis. Nie pobraliśmy żadnej opłaty.</div>
<div class="btns"><button type="button" class="btn primary">Pokaż najbliższą wolną</button><button type="button" class="btn secondary">Skanuj inną</button></div>
</div>
</div>
</body>
</html>
