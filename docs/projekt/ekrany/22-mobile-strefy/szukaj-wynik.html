<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Wynik wyszukiwania</title>
<!-- Aplikacja mobilna, strefy (iteracja 4, pytanie 9, decyzje D4 i D5; ADR 0045 o wyszukiwaniu Photon, ADR 0048 o trasach z OSRM). Stan po wybraniu wyniku z 04-mobile-mapa/mapa-szukaj: pasek „Dokąd jedziesz?” z 01-kierunek-produktowy/produkt-mapa pokazuje wybrany cel (strzałka wraca do mapy, krzyżyk czyści cel i otwiera wyszukiwanie). Mapa pokazuje pinezkę celu (grafit; kobalt zostaje dla Twojej pozycji i wybranej hulajnogi), strefy parkowania przy celu, strefę wolnej jazdy, w której leży cel (S-01 Okolice Rynku), Twoje położenie i wolne hulajnogi przy Tobie. Bez linii trasy i bez nawigacji zakręt po zakręcie (D5).
     Karta celu: nazwa i opis z Photon (GET /places/search?q przez API, obszar działania z zapasem 1 km, 5 wyników), odległość w linii prostej od klienta, „≈ 9 min hulajnogą” z OSRM (profil rowerowy), najbliższa strefa parkowania przy celu z odległością od celu (funkcja najbliższej strefy parkowania z migracji 0006) i najbliższa wolna hulajnoga przy kliencie z odległością od klienta („stąd”, jak w karcie hulajnogi). Akcje jak w 20-mobile-wypozyczenie/mapa-karta-rezerwuj: „Zarezerwuj” rezerwuje hulajnogę z wiersza (#0027, dalej 04-mobile-mapa/mapa-rezerwacja z trasą pieszą z 22-mobile-strefy/hulajnoga-trasa), „Skanuj i jedź” otwiera skaner. Dotknięcie wiersza hulajnogi otwiera jej kartę, a wiersza strefy przybliża mapę do strefy. Cel w strefie wolnej jazdy dopisuje limit do notki; poza nią notka mówi tylko o szacunku. Gdy przy kliencie nie ma wolnej hulajnogi, wiersz mówi „Brak wolnych hulajnóg w pobliżu”, a „Zarezerwuj” znika.
     Zachowanie: wybrany cel trafia na początek listy „Ostatnio wyszukiwane” na urządzeniu (D4, bez „Dom” i „Praca”). Cel znika po rozpoczęciu przejazdu albo po wyczyszczeniu paska.
     Dane przykładowe: cel Rynek w Rybniku, strefy P-01 Rynek i S-01 Okolice Rynku z danych startowych, hulajnoga #0027 (numer czterocyfrowy jak w panelu i w temacie MQTT), klientka Anna. Odległości i czasy przykładowe. Etykiety pochodzą z pliku tłumaczeń aplikacji (ADR 0032); wartości nieustalone w nawiasach. Plansza 390×844 px, wartości z docs/projekt/tokens.json. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#F6F6F3;color:#16181D;font-family:Inter,system-ui,sans-serif}
.phone.map{background:#EFEFEC}
.phone.camera{background:#2A2D33}
.page{padding:20px 20px 32px;display:flex;flex-direction:column}
.glass{background:rgba(246,246,243,0.84);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.7);box-shadow:0 12px 40px rgba(22,24,29,0.14)}
.topbar{position:absolute;left:16px;right:16px;top:20px;display:flex;gap:10px;align-items:center}
.round{width:44px;height:44px;border-radius:22px;border:none;background:#E3E3DE;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.round.small{width:40px;height:40px;border-radius:20px;background:transparent}
.pill{height:40px;padding:0 16px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.banner{position:absolute;left:16px;right:16px;top:20px;border-radius:22px;padding:14px 16px;display:flex;gap:14px;align-items:flex-start}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;border-radius:32px;padding:24px;display:flex;flex-direction:column;gap:16px}
.ride-sheet{position:absolute;left:0;right:0;bottom:0;height:384px;background:#F6F6F3;border-radius:32px 32px 0 0;padding:32px 24px 28px;display:flex;flex-direction:column}
.btn{height:56px;border-radius:28px;border:none;padding:0 20px;font-family:Inter,sans-serif;font-size:17px;font-weight:600;width:100%;white-space:nowrap}
.btn.primary{background:#2B3FF5;color:#FFFFFF}
.btn.secondary{background:#E3E3DE;color:#16181D}
.btn.dark{background:#16181D;color:#FFFFFF}
.btns{display:flex;flex-direction:column;gap:10px}
.btns.split{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.btns.half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.badge{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.b44{width:44px;height:44px}
.b48{width:48px;height:48px}
.b56{width:56px;height:56px}
.neutral{background:#E3E3DE} .danger{background:#FBE3E3} .warn{background:#FFF1DB} .accent{background:#EEF0FE}
.chip{display:inline-flex;height:30px;padding:0 12px;border-radius:15px;font-size:13px;font-weight:600;align-items:center}
.chip.danger{background:#FBE3E3;color:#C62F2F}
.b-title{font-size:16px;font-weight:600}
.b-body{font-size:14px;line-height:1.45;color:#6B6E75}
.alert-title{font-size:19px;font-weight:600;letter-spacing:-0.01em}
.body15{font-size:15px;line-height:1.45;color:#6B6E75}
.muted{color:#6B6E75}
.num{font-weight:500}
.label13{font-size:13px;font-weight:500;color:#6B6E75}
.timer{font-size:72px;font-weight:500;letter-spacing:-0.035em;line-height:1;text-align:center;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center}
.stats > div{display:flex;flex-direction:column;gap:2px}
.stats > div:nth-child(2){border-left:1px solid #E3E3DE;border-right:1px solid #E3E3DE}
.stats .v{font-size:20px;font-weight:500;letter-spacing:-0.015em}
.stats .l{font-size:13px;color:#6B6E75}
.group{background:#FFFFFF;border-radius:20px;border:1px solid #E3E3DE;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 16px;font-size:15px}
.grow + .grow{border-top:1px solid #E3E3DE}
.section{font-size:14px;font-weight:600;color:#6B6E75}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #E3E3DE}
.row .ico{width:40px;height:40px;border-radius:20px;background:#E3E3DE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .txt{flex-grow:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t{font-size:16px;font-weight:500}
.row .s{font-size:14px;color:#6B6E75}
.row .e{font-size:14px;color:#6B6E75}
svg{flex-shrink:0}
</style>
</head>
<body>

<text x="322" y="271" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#2B3FF5">P</text>

<div class="glass" style="position:absolute;left:16px;right:16px;top:20px;height:52px;border-radius:26px;display:flex;align-items:center;padding:0 6px;gap:6px">
<button type="button" class="round small" aria-label="Wróć do mapy"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex-grow:1;font-size:16px;font-weight:500">Rynek</div>
<button type="button" class="round small" aria-label="Wyczyść cel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6E75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="sheet glass">
<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
<div style="display:flex;flex-direction:column;gap:4px;min-width:0">
<span style="font-size:22px;font-weight:600;letter-spacing:-0.02em">Rynek</span>
<span style="font-size:14px;color:#6B6E75">Centrum, <span class="num">2,1 km</span> stąd</span>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0">
<span style="font-size:27px;font-weight:500;letter-spacing:-0.02em;line-height:1.1">≈ 9 min</span>
<span style="font-size:13px;color:#6B6E75">hulajnogą</span>
</div>
</div>
<div class="group">
<div class="grow"><div style="width:30px;height:22px;border-radius:6px;background:rgba(43,63,245,0.14);border:1.5px solid #2B3FF5;color:#2B3FF5;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0">P</div><span style="flex-grow:1;font-weight:500;white-space:nowrap">P-01 Rynek</span><span style="font-size:14px;color:#6B6E75;white-space:nowrap"><span class="num">80 m</span> od celu</span></div>
<div class="grow"><div style="width:30px;display:flex;justify-content:center;flex-shrink:0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="18" r="2.5"></circle><circle cx="18.5" cy="18" r="2.5"></circle><path d="M8 18h8M16.5 16.5L14 4h3.5"></path></svg></div><span style="flex-grow:1;font-weight:500;white-space:nowrap">Hulajnoga #0027</span><span style="font-size:14px;color:#6B6E75;white-space:nowrap"><span class="num">120 m</span> stąd</span></div>
</div>
<div style="font-size:13px;line-height:1.45;color:#6B6E75;margin-top:-4px">Przy celu obowiązuje wolna jazda do [LIMIT] km/h. Czas przejazdu hulajnogą jest szacunkowy.</div>
<div class="btns split"><button type="button" class="btn secondary">Zarezerwuj</button><button type="button" class="btn primary">Skanuj i jedź</button></div>
</div>
</div>
</body>
</html>
