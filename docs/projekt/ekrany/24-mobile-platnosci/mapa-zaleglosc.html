<!-- Aplikacja mobilna, mapa (iteracja 5, pytania 4 i 6, decyzje D4 i D8; ADR 0049 rozliczenie przejazdu). Stan mapy, gdy klient ma przejazd UNPAID (nieudane obciążenie karty po zakończeniu): mapa z paskiem „Dokąd jedziesz?” z 01-kierunek-produktowy/produkt-mapa, wolne hulajnogi i strefy widoczne jak zwykle, a w miejscu karty hulajnogi szklany panel zaległości w układzie 07-mobile-platnosci/platnosci-brak-srodkow: odznaka błędu z kartą, kwota i data przejazdu, przyczyna, termin automatycznego ponowienia i „Zapłać teraz” (24-mobile-platnosci/zaleglosc-splata). 08-mobile-stany/stan-platnosc zostaje ekranem tuż po jeździe; ten panel jest stanem mapy po jej zamknięciu i po każdym uruchomieniu aplikacji (stan z API, zmiany przez rental.updated i wallet.updated, D8).
     Zachowanie: zaległość blokuje rezerwację i start (PAYMENT_OVERDUE, pytanie 6). Dotknięcie hulajnogi otwiera jej kartę (20-mobile-wypozyczenie/mapa-karta-rezerwuj) z tym samym procentem baterii i ceną, ale zamiast „Zarezerwuj” i „Skanuj i jedź” z jednym przyciskiem „Zapłać zaległość” i dopiskiem „Masz nieopłacony przejazd z dzisiaj, 9:12.”; skan i wpisanie numeru kończą się tym samym komunikatem. Panelu nie da się zamknąć, można go zwinąć do paska (ten sam tekst w jednej linii). Jedno automatyczne ponowienie po 24 h tą samą kartą (pytanie 6) — po nim dopisek o terminie znika, a przy kolejnej odmowie zostaje „Ponowna próba się nie udała.”. Po spłacie (także automatycznej) panel znika, a przejazd przechodzi do ENDED z paragonem. Kilka zaległości: tytuł „Nieopłacone przejazdy (2)” i suma kwot; spłata obejmuje wszystkie po kolei.
     Wariant ujemnego salda (pytanie 4), bez osobnej planszy: ten sam panel z odznaką ostrzeżenia (#FFF1DB, ikona portfela #8F5500), tytułem „Ujemne saldo”, podtytułem „Saldo −4,20 zł”, tekstem „Doładuj portfel, żeby znów rezerwować i jeździć.” i przyciskiem „Doładuj portfel” (24-mobile-platnosci/doladowanie-kwota z podpowiedzianą kwotą), bez dopisku o ponowieniu. Start jest zablokowany także przy płatności kartą (karta nie pokrywa długu w portfelu). Gdy klient ma i zaległość, i ujemne saldo, pierwszeństwo ma zaległość UNPAID.
     Dane przykładowe: klientka Anna, hulajnoga #0027 (numer czterocyfrowy jak w panelu i w temacie MQTT), karty testowe operatora płatności Visa •••• 4242 i Mastercard •••• 4444; salda i kwoty doładowań przykładowe. Ceny, minimum, koszt przejazdu i stawka VAT w nawiasach (otwarte decyzje; VAT 23% to wartość robocza z danych startowych do potwierdzenia przez autora). Etykiety pochodzą z plików tłumaczeń (ADR 0032). Plansza 390×844 px, wartości z docs/projekt/tokens.json. -->
