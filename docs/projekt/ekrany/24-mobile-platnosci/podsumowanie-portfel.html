<title>Podsumowanie przejazdu – portfel</title>
<!-- Aplikacja mobilna, przejazd (iteracja 5, pytania 4, 8 i 12, decyzja D4; ADR 0049 rozliczenie przejazdu, ADR 0052 paragony, ADR 0042 wycena). Wariant 02-mobile-przeplyw/flow-podsumowanie i 20-mobile-wypozyczenie/podsumowanie-bez-platnosci po rozliczeniu z portfela: obciążenie RIDE_CHARGE w wallet_ledger, stan ENDED i paragon powstają w jednej transakcji (D4), więc ekran od razu pokazuje „Zapłacono z: Portfel”, saldo po przejeździe (balance_after wpisu obciążenia) i przycisk „Paragon” (24-mobile-platnosci/paragon). Neutralna informacja o braku rozliczenia z iteracji 3 znika; zdjęcie parkowania z flow-podsumowanie dalej w iteracji 6. Mapa niższa niż w podsumowanie-bez-platnosci, żeby zmieściły się dwa nowe wiersze. Ten sam ekran otwiera się z historii przejazdów.
     Wariant ujemnego salda (pytanie 4), bez osobnej planszy: przejazd kosztował więcej, niż było w portfelu, więc saldo spada poniżej zera (np. „Saldo po przejeździe −4,20 zł” w kolorze błędu #C62F2F). Pod wierszami pojawia się pasek ostrzeżenia w układzie z 24-mobile-platnosci/metody-platnosci (tło #FFF1DB, ikona i tekst #8F5500): „Doładuj portfel, żeby pojechać ponownie. Ujemne saldo blokuje rezerwację i start.”, a przyciski to „Doładuj portfel” (główny, kobalt, do 24-mobile-platnosci/doladowanie-kwota z podpowiedzianą kwotą co najmniej pokrywającą minimum) i „Paragon” (drugorzędny); „Gotowe” przechodzi do ikony ✕ w lewym górnym rogu. Mapa po powrocie pokazuje wariant ujemnego salda z 24-mobile-platnosci/mapa-zaleglosc.
     Przejazd o kwocie 0 (ADR 0049): bez wiersza „Zapłacono z”, bez salda i bez „Paragon”, z dopiskiem „Za ten przejazd nic nie płacisz.”. Przejazd z iteracji 3 i 4 bez rozliczenia (pytanie 12) otwiera się z historii w wersji podsumowanie-bez-platnosci z tekstem „Ten przejazd nie został rozliczony.”.
     Dane przykładowe: klientka Anna, hulajnoga #0027 (numer czterocyfrowy jak w panelu i w temacie MQTT), karty testowe operatora płatności Visa •••• 4242 i Mastercard •••• 4444; salda i kwoty doładowań przykładowe. Ceny, minimum, koszt przejazdu i stawka VAT w nawiasach (otwarte decyzje; VAT 23% to wartość robocza z danych startowych do potwierdzenia przez autora). Etykiety pochodzą z plików tłumaczeń (ADR 0032). Plansza 390×844 px, wartości z docs/projekt/tokens.json. -->

.cardmini.blik{background:#E3E3DE;color:#16181D;font-size:9px;letter-spacing:0}

.chip{display:inline-flex;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:600;align-items:center;white-space:nowrap}
.chip.neutral{background:#E3E3DE;color:#16181D}
.chip.warn{background:#FFF1DB;color:#8F5500}
.chip.danger{background:#FBE3E3;color:#C62F2F}
.pillsel{height:40px;padding:0 16px;border-radius:20px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pillsel.off{background:#FFFFFF;border:1px solid #E3E3DE}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stats > div{display:flex;flex-direction:column;gap:2px}
.stats .v{font-size:18px;font-weight:500;letter-spacing:-0.015em}
