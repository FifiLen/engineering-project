<title>Zakończenie bez łączności – poza strefą</title>
<!-- Aplikacja mobilna, przejazd (iteracja 6, pytanie 1; ADR 0056). Odmowa zakończenia na ekranie 05-mobile-przejazd/przejazd-lacznosc, gdy hulajnoga nie odpowiada, a jej ostatnia znana pozycja leży poza strefą parkowania (ta plansza) albo jest starsza niż 2 min. Układ 05-mobile-przejazd/przejazd-poza-strefa z odznaką błędu i tytułem „Tu nie zakończysz jazdy”; podtytuł mówi o ostatniej pozycji, bo aplikacja nie wie, gdzie hulajnoga jest teraz. Wariant „pozycja starsza niż 2 min” (bez osobnej planszy): podtytuł „Nie znamy aktualnej pozycji hulajnogi.”, tekst „Hulajnoga nie odpowiada od [4] min. Zakończysz jazdę, gdy odezwie się w strefie parkowania. Naliczanie trwa.”, bez prowadzenia, jeśli telefon nie ma lokalizacji. „Prowadź do strefy” liczy trasę od pozycji telefonu (klient jest przy hulajnodze), a nie od ostatniej pozycji hulajnogi; wjazd do strefy z hulajnogą offline nie wystarcza, zakończenie przyjmie dopiero nowa pozycja z hulajnogi. Pigułki u góry: stan łączności i czas od ostatniej pozycji, czas przejazdu. Dopisek o pomocy jak w 20-mobile-wypozyczenie/przejazd-blokada-nieudana; po 30 min bez łączności naliczanie zatrzymuje się samo, a przejazd kończy operator (pytanie 1), co mówi ostatnie zdanie tekstu.
     Dane przykładowe: klientka Anna, hulajnoga #0027 (numer czterocyfrowy jak w panelu i w temacie MQTT), przejazd R-51846, strefa P-01 Rynek z danych startowych Rybnika, zgłoszenia Z-1042 i Z-1046 (numer zgłoszenia wymaga sekwencji w migracji 0008, jak service_task_number_seq). Etykiety pochodzą z pliku tłumaczeń aplikacji (ADR 0032), treści powiadomień z szablonów notification_templates (wymaganie 17); kwoty, limity i czasy nieustalone w nawiasach. Plansza 390×844 px, wartości z docs/projekt/tokens.json. -->

.lines{display:flex;flex-direction:column;font-size:15px}
.lines > div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #E3E3DE}
.lines > div:last-child{border-bottom:1px solid #E3E3DE}
