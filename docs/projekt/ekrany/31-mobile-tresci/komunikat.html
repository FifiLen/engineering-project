<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Komunikat na mapie</title>
<!-- Aplikacja mobilna, iteracja 8 (dług z iteracji 7, pytanie 14; ADR 0062). Komunikat z sekcji treści mobile.notice (rejestr CONTENT_SECTIONS: blok pojedynczy, opcjonalny, treść Markdown inline do 140 znaków i opcjonalny przycisk z etykietą do 40 znaków i adresem) pod paskiem „Dokąd jedziesz?” na ekranie mapy, nad rzędem z legendą stref i położeniem. Pokazuje się tylko, gdy sekcja jest opublikowana (GET /content/mobile zwraca tylko opublikowane sekcje) i ma treść; w szkicu albo archiwum go nie ma. Karta szklana jak pasek wyszukiwania i baner powiadomienia (26-mobile-operacje/baner-powiadomienia): promień 20 px, ikona informacji w kobaltowym kółku 32 px, treść 14 px w kolorze tekstu, przycisk tekstowy kobaltowy (jedyny kolor akcji) pod treścią, ✕ 32 px z prawej. Przycisk otwiera adres https:, mailto: albo tel: (ten sam warunek co odnośniki w Markdown aplikacji, isAllowedHref); ścieżki strony aplikacja pomija, więc przycisk znika. ✕ chowa komunikat na stałe dla tej wersji treści (skrót treści i przycisku zapisany w pamięci telefonu); zmiana treści w panelu pokazuje go ponownie. Komunikat jest tylko w widoku podstawowym mapy (bez rezerwacji, legendy i wybranego celu), żeby nie zasłaniał kart rezerwacji i trasy. Dane przykładowe z danych startowych Rybnika; treść i adres to przykład redaktora, nie wartość ze startu. Etykiety (Zamknij komunikat) z pliku tłumaczeń aplikacji (ADR 0032), treść z bazy (wymaganie 17). Plansza 390×844 px, wartości z docs/projekt/tokens.json. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#EFEFEC;color:#16181D;font-family:Inter,system-ui,sans-serif}
.glass{background:rgba(246,246,243,0.84);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,0.7);box-shadow:0 12px 40px rgba(22,24,29,0.14)}
.top{position:absolute;left:16px;right:16px;top:20px;display:flex;flex-direction:column;gap:12px}
.search{height:52px;border-radius:26px;display:flex;align-items:center;padding:0 6px 0 18px;gap:10px}
.notice{border-radius:20px;padding:12px 8px 12px 12px;display:flex;gap:12px;align-items:flex-start}
.notice .icon{width:32px;height:32px;border-radius:16px;background:#EEF0FE;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notice .text{flex-grow:1;display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:6px}
.notice .body{font-size:14px;line-height:1.4}
.notice .action{align-self:flex-start;border:none;background:transparent;padding:0;font-family:Inter,sans-serif;font-size:14px;font-weight:600;color:#2B3FF5;height:24px}
.close{width:32px;height:32px;border:none;border-radius:16px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center}
.pill{height:40px;padding:0 16px;border-radius:20px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.round{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:0}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;border-radius:32px;padding:24px;display:flex;flex-direction:column;gap:20px}
.num{font-weight:500}
</style>
</head>
<body>
<div class="phone">
<svg viewBox="0 0 390 844" width="390" height="844" style="position:absolute;left:0;top:0;display:block" role="img" aria-label="Mapa okolicy z wolnymi hulajnogami i strefą parkowania">
<rect x="0" y="0" width="390" height="844" fill="#EFEFEC"></rect><rect x="232" y="250" width="140" height="170" rx="16" fill="#E5E8E1"></rect><path d="M-10 560 C 110 520 230 640 400 590" stroke="#DFE3E8" stroke-width="30" fill="none"></path><path d="M0 120 L390 92 M262 0 L300 844 M42 0 L62 844 M0 420 L390 384 M0 760 L390 730" stroke="#FAFAF8" stroke-width="5" fill="none"></path><path d="M0 330 L390 286 M124 0 L166 844 M0 680 L390 640" stroke="#FFFFFF" stroke-width="10" fill="none"></path><rect x="300" y="444" width="62" height="44" rx="10" fill="#2B3FF5" fill-opacity="0.16" stroke="#2B3FF5" stroke-width="1.5"></rect><text x="331" y="472" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#2B3FF5">P</text>
<circle cx="96" cy="330" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="214" cy="360" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="300" cy="300" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="88" cy="440" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="320" cy="380" r="6" fill="#16181D" stroke="#FFFFFF" stroke-width="2.5"></circle><circle cx="250" cy="520" r="22" fill="#2B3FF5" fill-opacity="0.14"></circle><circle cx="250" cy="520" r="10" fill="#2B3FF5" stroke="#FFFFFF" stroke-width="3"></circle>
</svg>
<div class="top">
<div class="search glass">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6E75" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<button type="button" style="flex-grow:1;height:44px;border:none;background:transparent;text-align:left;padding:0;font-family:Inter,sans-serif;font-size:16px;color:#6B6E75">Dokąd jedziesz?</button>
<button type="button" aria-label="Profil" style="width:40px;height:40px;border-radius:20px;border:none;background:#16181D;color:#F6F6F3;font-family:Inter,sans-serif;font-size:14px;font-weight:500">A</button>
</div>
<div class="notice glass" role="note">
<div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2B3FF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg></div>
<div class="text">
<span class="body">W sobotę <span class="num">[23.05]</span> Rynek jest zamknięty dla hulajnóg z powodu [wydarzenia]. Parkuj w sąsiednich strefach.</span>
<button type="button" class="action">Szczegóły</button>
</div>
<button type="button" class="close" aria-label="Zamknij komunikat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="row">
<div class="pill glass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Strefy</div>
<button type="button" class="round glass" aria-label="Pokaż moje położenie"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"></path></svg></button>
</div>
</div>
<div class="sheet glass">
<div style="display:flex;justify-content:space-between;align-items:center;gap:16px">
<div style="display:flex;flex-direction:column;gap:2px">
<div style="font-size:13px;font-weight:500;color:#6B6E75">Hulajnoga #0031</div>
<div style="font-size:50px;font-weight:500;letter-spacing:-0.03em;line-height:1">74%</div>
<div style="font-size:14px;color:#6B6E75">≈ <span class="num">20</span> km zasięgu</div>
</div>
<img src="../../rendery/hulajnoga-grafit-bok.png" alt="Hulajnoga w wariancie Grafit, widok z boku" style="width:140px;height:112px;object-fit:contain;display:block;flex-shrink:0">
</div>
<div style="display:flex;justify-content:space-between;font-size:14px;padding-top:16px;border-top:1px solid #E3E3DE"><span><span class="num">90</span> m · <span class="num">1</span> min pieszo</span><span class="num">[CENA] zł/min</span></div>
<button type="button" style="height:56px;border:none;border-radius:28px;background:#2B3FF5;color:#FFFFFF;font-family:Inter,sans-serif;font-size:17px;font-weight:600">Skanuj i jedź</button>
</div>
</div>
</body>
</html>
