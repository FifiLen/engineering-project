<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hulajnoga – model 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600&display=swap">
<style>
:root {
  --ground: #F6F6F3;
  --ink: #16181D;
  --muted: #6B6E75;
  --line: #E3E3DE;
  --ghost: #E9E9E4;
  --glass: rgba(246, 246, 243, 0.78);
  --glass-border: rgba(255, 255, 255, 0.75);
  --accent: #2B3FF5;
  --focus: #2B3FF5;
  --is-dark: 0;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #16181D;
    --ink: #F6F6F3;
    --muted: #A3A6AD;
    --line: #2E323B;
    --ghost: #1E2127;
    --glass: rgba(31, 34, 41, 0.74);
    --glass-border: rgba(255, 255, 255, 0.08);
    --focus: #8A97FF;
    --is-dark: 1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #16181D;
  --ink: #F6F6F3;
  --muted: #A3A6AD;
  --line: #2E323B;
  --ghost: #1E2127;
  --glass: rgba(31, 34, 41, 0.74);
  --glass-border: rgba(255, 255, 255, 0.08);
  --focus: #8A97FF;
  --is-dark: 1;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--ground); }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.stage { position: relative; height: 100%; overflow: hidden; }
.ghost {
  position: absolute; left: 0; right: 0; top: 46%;
  transform: translateY(-50%);
  text-align: center;
  font-size: clamp(110px, 25vw, 380px);
  font-weight: 200;
  letter-spacing: -0.06em;
  line-height: 1;
  color: var(--ghost);
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
  transition: opacity 400ms ease;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
.top {
  position: absolute; left: 0; right: 0; top: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
  padding: 24px 28px; pointer-events: none;
}
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand strong { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.brand span { font-size: 14px; color: var(--muted); }
.hint { font-size: 14px; color: var(--muted); transition: opacity 500ms ease; padding-top: 4px; }
.hint.gone { opacity: 0; }
.bar {
  position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
  width: min(760px, calc(100% - 24px));
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px;
  padding: 12px 14px 12px 20px;
  border-radius: 28px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: 0 12px 40px rgba(22, 24, 29, 0.14);
}
.group { display: flex; align-items: center; gap: 10px; }
.variant-name { font-size: 15px; font-weight: 500; min-width: 56px; }
.swatch {
  width: 44px; height: 44px; border-radius: 22px; border: none; padding: 0;
  background: transparent; display: grid; place-items: center; cursor: pointer;
}
.swatch span {
  width: 26px; height: 26px; border-radius: 13px; display: block;
  box-shadow: inset 0 0 0 1px rgba(22, 24, 29, 0.16);
  outline: 2px solid transparent; outline-offset: 3px;
  transition: outline-color 200ms ease;
}
.swatch[aria-pressed="true"] span { outline-color: var(--ink); }
.seg { display: flex; background: var(--line); border-radius: 22px; padding: 3px; }
.seg button {
  height: 38px; padding: 0 14px; border: none; border-radius: 19px;
  background: transparent; color: var(--ink);
  font: 500 14px/1 Inter, -apple-system, sans-serif; cursor: pointer;
  transition: background 200ms ease, color 200ms ease;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.pill {
  height: 44px; padding: 0 18px; border-radius: 22px; border: none; cursor: pointer;
  font: 600 14px/1 Inter, -apple-system, sans-serif;
}
.pill.quiet { background: var(--line); color: var(--ink); }
.pill.quiet[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.pill.primary { background: var(--accent); color: #FFFFFF; }
.pill[hidden] { display: none; }
button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.swatch:focus-visible { outline-offset: -2px; }
.status {
  position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -10px);
  font-size: 13px; color: var(--muted); white-space: nowrap;
}
.fallback {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  text-align: center; padding: 32px; font-size: 16px; color: var(--muted);
}
.fallback.on { display: flex; }
@media (max-width: 640px) {
  .top { padding: 18px 18px; }
  .hint { display: none; }
  .bar { justify-content: center; padding: 12px; border-radius: 24px; }
  .seg button { padding: 0 11px; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="ghost" id="ghost" aria-hidden="true">Grafit</div>
  <div class="fallback" id="fallback">Ta przeglądarka nie wyświetla grafiki 3D (WebGL). Otwórz stronę w aktualnym Chrome, Safari lub Firefoksie.</div>
  <header class="top">
    <div class="brand">
      <strong>[nazwa]</strong>
      <span>Model koncepcyjny hulajnogi</span>
    </div>
    <div class="hint" id="hint">Przeciągnij, aby obrócić. Przybliż kółkiem lub szczypaniem.</div>
  </header>
  <div class="bar" role="toolbar" aria-label="Ustawienia widoku modelu">
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="group" role="group" aria-label="Wariant kolorystyczny">
      <span class="variant-name" id="variantName">Grafit</span>
      <button class="swatch" type="button" data-variant="grafit" aria-label="Wariant Grafit" aria-pressed="true"><span style="background:#2A2D33"></span></button>
      <button class="swatch" type="button" data-variant="beton" aria-label="Wariant Beton" aria-pressed="false"><span style="background:#E4E4DF"></span></button>
      <button class="swatch" type="button" data-variant="kobalt" aria-label="Wariant Kobalt" aria-pressed="false"><span style="background:#2B3FF5"></span></button>
    </div>
    <div class="seg" role="group" aria-label="Kąt kamery">
      <button type="button" data-view="trzy" aria-pressed="true">3/4</button>
      <button type="button" data-view="bok" aria-pressed="false">Bok</button>
      <button type="button" data-view="przod" aria-pressed="false">Przód</button>
      <button type="button" data-view="gora" aria-pressed="false">Góra</button>
    </div>
    <div class="group">
      <button class="pill quiet" type="button" id="spin" aria-pressed="true">Obrót</button>
      <button class="pill primary" type="button" id="save" hidden>Zapisz PNG</button>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var statusEl = document.getElementById('status');
  var hintEl = document.getElementById('hint');
  var ghostEl = document.getElementById('ghost');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!window.THREE || !THREE.OrbitControls || !THREE.RoomEnvironment || !THREE.RoundedBoxGeometry) {
    document.getElementById('fallback').classList.add('on');
    return;
  }
  if (THREE.ColorManagement) THREE.ColorManagement.legacyMode = false;

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  } catch (e) {
    document.getElementById('fallback').classList.add('on');
    return;
  }
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.domElement.setAttribute('role', 'img');
  renderer.domElement.setAttribute('aria-label', 'Trójwymiarowy model hulajnogi elektrycznej, który można obracać');
  stage.insertBefore(renderer.domElement, document.getElementById('fallback'));

  var scene = new THREE.Scene();
  var pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

  var camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  var TARGET = new THREE.Vector3(0.02, 0.5, 0);

  var key = new THREE.DirectionalLight(0xffffff, 1.3);
  key.position.set(1.4, 3.6, 2.0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -1.4; key.shadow.camera.right = 1.4;
  key.shadow.camera.top = 1.4; key.shadow.camera.bottom = -1.4;
  key.shadow.camera.near = 0.5; key.shadow.camera.far = 10;
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  scene.add(key);
  var rim = new THREE.DirectionalLight(0xffffff, 0.6);
  rim.position.set(-2.5, 1.8, -2.0);
  scene.add(rim);

  var shadowMat = new THREE.ShadowMaterial({ opacity: 0.16 });
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), shadowMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  var M = {
    body: new THREE.MeshPhysicalMaterial({ color: '#2A2D33', metalness: 0.15, roughness: 0.38, clearcoat: 1, clearcoatRoughness: 0.12 }),
    accent: new THREE.MeshStandardMaterial({ color: '#2B3FF5', metalness: 0.2, roughness: 0.35 }),
    metal: new THREE.MeshStandardMaterial({ color: '#A3A6AD', metalness: 0.9, roughness: 0.26 }),
    darkMetal: new THREE.MeshStandardMaterial({ color: '#3A3D44', metalness: 0.75, roughness: 0.32 }),
    rubber: new THREE.MeshStandardMaterial({ color: '#1A1B1E', metalness: 0, roughness: 0.92 }),
    grip: new THREE.MeshStandardMaterial({ color: '#202226', metalness: 0, roughness: 1 }),
    screen: new THREE.MeshStandardMaterial({ color: '#0E1020', emissive: '#7A88FF', emissiveIntensity: 1.2, roughness: 0.2 }),
    lamp: new THREE.MeshStandardMaterial({ color: '#FFFFFF', emissive: '#FFFFFF', emissiveIntensity: 2.4 }),
    tail: new THREE.MeshStandardMaterial({ color: '#5A0A0A', emissive: '#FF3B30', emissiveIntensity: 1.6 })
  };

  var scooter = new THREE.Group();
  scene.add(scooter);
  function V(x, y, z) { return new THREE.Vector3(x, y, z || 0); }
  function add(mesh) { mesh.castShadow = true; mesh.receiveShadow = true; scooter.add(mesh); return mesh; }
  var UP = V(0, 1, 0);
  function orient(mesh, p0, p1) {
    var v = new THREE.Vector3().subVectors(p1, p0);
    mesh.position.copy(p0).addScaledVector(v, 0.5);
    mesh.quaternion.setFromUnitVectors(UP, v.clone().normalize());
    return mesh;
  }
  function rod(p0, p1, r, mat) {
    var len = p0.distanceTo(p1);
    return add(orient(new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 40), mat), p0, p1));
  }
  function beam(p0, p1, w, d, mat) {
    var len = p0.distanceTo(p1);
    var rad = Math.min(w, d, len) * 0.32;
    return add(orient(new THREE.Mesh(new THREE.RoundedBoxGeometry(w, len, d, 4, rad), mat), p0, p1));
  }
  function box(w, h, d, mat, pos) {
    var m = new THREE.Mesh(new THREE.RoundedBoxGeometry(w, h, d, 4, Math.min(w, h, d) * 0.35), mat);
    m.position.copy(pos);
    return add(m);
  }

  var R = 0.115;
  var FRONT = V(0.47, R, 0);
  var REAR = V(-0.43, R, 0);

  function wheel(c) {
    var tire = add(new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.03, 28, 72), M.rubber));
    tire.position.copy(c);
    var hub = add(new THREE.Mesh(new THREE.CylinderGeometry(0.064, 0.064, 0.05, 48), M.darkMetal));
    hub.rotation.x = Math.PI / 2; hub.position.copy(c);
    [-1, 1].forEach(function (s) {
      var ring = add(new THREE.Mesh(new THREE.TorusGeometry(0.044, 0.005, 12, 48), M.accent));
      ring.position.copy(c).add(V(0, 0, s * 0.026));
      var cap = add(new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.008, 24), M.metal));
      cap.rotation.x = Math.PI / 2; cap.position.copy(c).add(V(0, 0, s * 0.028));
    });
  }
  wheel(FRONT);
  wheel(REAR);

  function fender(c, startDeg, arcDeg) {
    var m = add(new THREE.Mesh(new THREE.TorusGeometry(0.142, 0.011, 12, 64, THREE.MathUtils.degToRad(arcDeg)), M.body));
    m.position.copy(c);
    m.rotation.z = THREE.MathUtils.degToRad(startDeg);
    m.scale.z = 2.6;
    return m;
  }
  fender(REAR, 40, 140);
  fender(FRONT, 25, 95);

  box(0.62, 0.055, 0.17, M.body, V(0.02, 0.11, 0));
  box(0.54, 0.006, 0.14, M.grip, V(0.02, 0.1405, 0));
  box(0.5, 0.008, 0.173, M.accent, V(0.02, 0.098, 0));
  box(0.014, 0.022, 0.05, M.tail, V(-0.572, 0.142, 0));

  var tilt = THREE.MathUtils.degToRad(14);
  var dir = V(-Math.sin(tilt), Math.cos(tilt), 0);
  function onAxis(t) { return FRONT.clone().addScaledVector(dir, t); }
  var s0 = onAxis(0.19);
  var s1 = onAxis(1.0);

  [-1, 1].forEach(function (s) {
    beam(FRONT.clone().add(V(0, 0, s * 0.046)), s0.clone().add(V(0, 0, s * 0.046)), 0.026, 0.014, M.metal);
  });
  beam(s0.clone().addScaledVector(dir, -0.012), s0.clone().addScaledVector(dir, 0.035), 0.05, 0.12, M.darkMetal);
  beam(V(0.26, 0.128, 0), s0.clone().add(V(0.01, 0.02, 0)), 0.06, 0.09, M.body);
  rod(s0, s1, 0.024, M.body);
  rod(onAxis(0.30), onAxis(0.36), 0.031, M.darkMetal);
  rod(onAxis(0.86), onAxis(0.9), 0.028, M.darkMetal);

  var lampBase = onAxis(0.66).add(V(0.02, 0, 0));
  rod(lampBase, lampBase.clone().add(V(0.035, 0, 0)), 0.024, M.body);
  rod(lampBase.clone().add(V(0.035, 0, 0)), lampBase.clone().add(V(0.039, 0, 0)), 0.019, M.lamp);

  rod(s1.clone().add(V(0, 0, -0.25)), s1.clone().add(V(0, 0, 0.25)), 0.013, M.metal);
  [-1, 1].forEach(function (s) {
    rod(s1.clone().add(V(0, 0, s * 0.15)), s1.clone().add(V(0, 0, s * 0.26)), 0.019, M.grip);
  });
  box(0.05, 0.04, 0.06, M.body, s1.clone());
  box(0.09, 0.022, 0.08, M.rubber, s1.clone().add(V(-0.005, 0.034, 0)));
  box(0.064, 0.003, 0.058, M.screen, s1.clone().add(V(-0.005, 0.0465, 0)));
  box(0.024, 0.012, 0.032, M.darkMetal, s1.clone().add(V(0.022, 0, 0.125)));
  beam(s1.clone().add(V(0.012, 0, -0.13)), s1.clone().add(V(0.075, -0.012, -0.22)), 0.012, 0.016, M.metal);

  rod(V(-0.06, 0.088, -0.085), V(-0.17, 0.012, -0.15), 0.007, M.metal);

  var VARIANTS = {
    grafit: { name: 'Grafit', body: '#2A2D33', accent: '#2B3FF5' },
    beton: { name: 'Beton', body: '#E4E4DF', accent: '#2B3FF5' },
    kobalt: { name: 'Kobalt', body: '#2B3FF5', accent: '#E4E4DF' }
  };
  var currentVariant = 'grafit';
  function setVariant(id) {
    var v = VARIANTS[id];
    if (!v) return;
    currentVariant = id;
    M.body.color.set(v.body);
    M.accent.color.set(v.accent);
    document.getElementById('variantName').textContent = v.name;
    ghostEl.textContent = v.name;
    document.querySelectorAll('[data-variant]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-variant') === id));
    });
  }

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.copy(TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 1.5;
  controls.maxDistance = 7;
  controls.maxPolarAngle = Math.PI / 2 - 0.04;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.9;

  var VIEWS = {
    trzy: V(2.0, 1.15, 2.5),
    bok: V(0.02, 0.62, 3.4),
    przod: V(3.4, 0.7, 0.02),
    gora: V(0.03, 3.7, 0.25)
  };
  var currentView = 'trzy';
  function viewPosition(id) {
    var off = VIEWS[id].clone().sub(TARGET);
    var aspect = camera.aspect || 1;
    var k = aspect < 1 ? Math.min(2.1, 1.05 / aspect) : 1;
    return TARGET.clone().add(off.multiplyScalar(k));
  }
  var anim = null;
  function goTo(id, instant) {
    currentView = id;
    document.querySelectorAll('[data-view]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-view') === id));
    });
    var to = viewPosition(id);
    if (instant || reduceMotion) {
      camera.position.copy(to);
      anim = null;
    } else {
      anim = { from: camera.position.clone(), to: to, t0: performance.now(), dur: 950 };
    }
  }
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  controls.addEventListener('start', function () {
    anim = null;
    hintEl.classList.add('gone');
  });

  var spinBtn = document.getElementById('spin');
  function setSpin(on) {
    controls.autoRotate = on;
    spinBtn.setAttribute('aria-pressed', String(on));
  }
  setSpin(!reduceMotion);
  spinBtn.addEventListener('click', function () { setSpin(!controls.autoRotate); });

  document.querySelectorAll('[data-variant]').forEach(function (b) {
    b.addEventListener('click', function () { setVariant(b.getAttribute('data-variant')); });
  });
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () {
      setSpin(false);
      goTo(b.getAttribute('data-view'));
    });
  });

  function readTheme() {
    var dark = getComputedStyle(document.documentElement).getPropertyValue('--is-dark').trim() === '1';
    shadowMat.opacity = dark ? 0.42 : 0.16;
  }
  readTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
  new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    var wasPortrait = camera.aspect < 1;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    if (wasPortrait !== (camera.aspect < 1) && !anim) goTo(currentView, true);
  }
  new ResizeObserver(resize).observe(stage);
  resize();
  goTo('trzy', true);

  function frame(now) {
    if (anim) {
      var t = Math.min(1, (now - anim.t0) / anim.dur);
      camera.position.lerpVectors(anim.from, anim.to, ease(t));
      if (t >= 1) anim = null;
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  var saveBtn = document.getElementById('save');
  var downloads = null;
  function say(text) {
    statusEl.textContent = text;
    clearTimeout(say.t);
    say.t = setTimeout(function () { statusEl.textContent = ''; }, 3500);
  }
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (d) {
      downloads = d;
      if (d) saveBtn.hidden = false;
    }).catch(function () {});
  }
  function renderPng() {
    var oldRatio = renderer.getPixelRatio();
    var oldW = stage.clientWidth, oldH = stage.clientHeight;
    var oldAspect = camera.aspect;
    var W = 2400, H = 1600;
    renderer.setPixelRatio(1);
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.render(scene, camera);
    return new Promise(function (resolve) {
      renderer.domElement.toBlob(function (blob) {
        renderer.setPixelRatio(oldRatio);
        renderer.setSize(oldW, oldH, false);
        camera.aspect = oldAspect;
        camera.updateProjectionMatrix();
        resolve(blob);
      }, 'image/png');
    });
  }
  saveBtn.addEventListener('click', function () {
    if (!downloads) return;
    saveBtn.disabled = true;
    renderPng().then(function (blob) {
      if (!blob) throw { code: 'bad_request' };
      return downloads.save({ filename: 'hulajnoga-' + currentVariant + '-' + currentView + '.png', data: blob });
    }).then(function () {
      say('Zapisano render.');
    }).catch(function (err) {
      var code = err && err.code;
      if (code === 'declined') say('Zapis anulowany.');
      else if (code === 'rate_limited') say('Poczekaj chwilę i spróbuj ponownie.');
      else if (code === 'unavailable' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
        saveBtn.hidden = true;
        say('Zapisywanie plików jest tu niedostępne.');
      } else say('Nie udało się przygotować pliku PNG.');
    }).then(function () { saveBtn.disabled = false; });
  });
})();
</script>
</body>
</html>
