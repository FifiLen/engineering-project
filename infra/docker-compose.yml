name: hulajnogi

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hulajnogi
      POSTGRES_PASSWORD: hulajnogi
      POSTGRES_DB: hulajnogi
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hulajnogi -d hulajnogi']
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: hulajnogi
      MINIO_ROOT_PASSWORD: hulajnogi-dev-secret
    ports:
      - '9000:9000'
      - '9090:9090'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hulajnogi hulajnogi-dev-secret &&
      mc mb --ignore-existing local/hulajnogi
      "

  # Jednorazowe przygotowanie danych tras: pobranie wycinka OSM województwa śląskiego
  # i przetworzenie go profilem rowerowym (hulajnogi poruszają się podobnie do rowerów).
  osrm-download:
    image: curlimages/curl:8.11.1
    user: root
    volumes:
      - ./osrm:/osrm
    entrypoint: >
      /bin/sh -c "
      mkdir -p /osrm/data &&
      if [ ! -f /osrm/data/slaskie-latest.osm.pbf ]; then
      curl -fL -o /osrm/data/slaskie-latest.osm.pbf https://download.geofabrik.de/europe/poland/slaskie-latest.osm.pbf;
      fi
      "

  osrm-prepare:
    image: osrm/osrm-backend:v5.27.1
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - ./osrm:/osrm
    entrypoint: ['/bin/sh', '/osrm/prepare.sh']

  osrm:
    image: osrm/osrm-backend:v5.27.1
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    command: osrm-routed --algorithm mld /osrm/data/slaskie-latest.osrm
    ports:
      - '5000:5000'
    volumes:
      - ./osrm:/osrm

volumes:
  postgres-data:
  mosquitto-data:
  minio-data:
