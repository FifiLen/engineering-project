name: hulajnogi

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hulajnogi
      POSTGRES_PASSWORD: hulajnogi
      POSTGRES_DB: hulajnogi
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hulajnogi -d hulajnogi']
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  # Magazyn plików zgodny z S3 (zdjęcia parkowania i zgłoszeń), ADR 0024.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: >
      mini -dir=/data -bucket=hulajnogi -s3.config=/etc/seaweedfs/s3.json
      -admin.ui=false -s3.port.iceberg=0
    ports:
      - '8333:8333'
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  # Jednorazowe przygotowanie danych tras: pobranie wycinka OSM województwa śląskiego
  # i przetworzenie go profilem rowerowym (hulajnogi poruszają się podobnie do rowerów).
  osrm-download:
    image: curlimages/curl:8.11.1
    user: root
    volumes:
      - ./osrm:/osrm
    entrypoint: >
      /bin/sh -c "
      mkdir -p /osrm/data &&
      if [ ! -f /osrm/data/slaskie-latest.osm.pbf ]; then
      curl -fL -o /osrm/data/slaskie-latest.osm.pbf https://download.geofabrik.de/europe/poland/slaskie-latest.osm.pbf;
      fi
      "

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - ./osrm:/osrm
    entrypoint: ['/bin/sh', '/osrm/prepare.sh']

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    command: osrm-routed --algorithm mld /osrm/data/slaskie-latest.osrm
    ports:
      - '${OSRM_PORT:-5000}:5000'
    volumes:
      - ./osrm:/osrm

  # Drugi OSRM z profilem pieszym: trasa klienta do hulajnogi (ADR 0048). Ten sam wycinek, osobne dane.
  osrm-foot-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - ./osrm:/osrm
    entrypoint: ['/bin/sh', '/osrm/prepare-foot.sh']

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    depends_on:
      osrm-foot-prepare:
        condition: service_completed_successfully
    command: osrm-routed --algorithm mld /osrm/foot/slaskie-latest.osrm
    ports:
      - '${OSRM_FOOT_PORT:-5002}:5000'
    volumes:
      - ./osrm:/osrm

  # Silnik dokumentów: DOCX i HTML na PDF (ADR 0066). Obraz z czcionką Inter budujemy z infra/gotenberg.
  # Port tylko na pętli zwrotnej, bo API w środowisku deweloperskim działa poza Compose.
  gotenberg:
    build: ./gotenberg
    image: hulajnogi-gotenberg:9.5.1-inter4.1
    ports:
      - '127.0.0.1:${GOTENBERG_PORT:-3010}:3000'
    mem_limit: 1536m
    environment:
      API_TIMEOUT: 30s
      API_BODY_LIMIT: 20MB
      # Silnik nie pobiera i nie wysyła niczego na wskazany adres.
      API_DISABLE_DOWNLOAD_FROM: 'true'
      WEBHOOK_DISABLE: 'true'
      # Tylko konwersja, bez tras i etapów przetwarzania PDF.
      PDF_DISABLE_ROUTES: 'true'
      PDF_DISABLE_STAGES: 'true'
      # Strona ładuje tylko pliki wysłane razem z nią; dokument nie wysyła żadnych żądań.
      CHROMIUM_DISABLE_JAVASCRIPT: 'true'
      CHROMIUM_DENY_PRIVATE_IPS: 'true'
      CHROMIUM_DENY_PUBLIC_IPS: 'true'
      LIBREOFFICE_DENY_PRIVATE_IPS: 'true'
      LIBREOFFICE_DENY_PUBLIC_IPS: 'true'
      # Silniki startują od razu, więc /health mówi prawdę od początku.
      LIBREOFFICE_AUTO_START: 'true'
      CHROMIUM_AUTO_START: 'true'
      # Przeciążenie daje 429 zamiast serii przekroczeń czasu.
      LIBREOFFICE_MAX_QUEUE_SIZE: '10'
      CHROMIUM_MAX_QUEUE_SIZE: '10'
      # 9.5.1 nie ma limitów pamięci silników: miękki limit procesu Go poniżej mem_limit.
      GOMEMLIMIT: 1200MiB
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  mosquitto-data:
  seaweedfs-data:
