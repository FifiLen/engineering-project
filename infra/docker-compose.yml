name: hulajnogi

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hulajnogi
      POSTGRES_PASSWORD: hulajnogi
      POSTGRES_DB: hulajnogi
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hulajnogi -d hulajnogi']
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
      - '9001:9001'
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  # Magazyn plików zgodny z S3 (zdjęcia parkowania i zgłoszeń), ADR 0024.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: >
      mini -dir=/data -bucket=hulajnogi -s3.config=/etc/seaweedfs/s3.json
      -admin.ui=false -s3.port.iceberg=0
    ports:
      - '8333:8333'
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  # Jednorazowe przygotowanie danych tras: pobranie wycinka OSM województwa śląskiego
  # i przetworzenie go profilem rowerowym (hulajnogi poruszają się podobnie do rowerów).
  osrm-download:
    image: curlimages/curl:8.11.1
    user: root
    volumes:
      - ./osrm:/osrm
    entrypoint: >
      /bin/sh -c "
      mkdir -p /osrm/data &&
      if [ ! -f /osrm/data/slaskie-latest.osm.pbf ]; then
      curl -fL -o /osrm/data/slaskie-latest.osm.pbf https://download.geofabrik.de/europe/poland/slaskie-latest.osm.pbf;
      fi
      "

  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    depends_on:
      osrm-download:
        condition: service_completed_successfully
    volumes:
      - ./osrm:/osrm
    entrypoint: ['/bin/sh', '/osrm/prepare.sh']

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.11.0-debian
    depends_on:
      osrm-prepare:
        condition: service_completed_successfully
    command: osrm-routed --algorithm mld /osrm/data/slaskie-latest.osrm
    ports:
      - '${OSRM_PORT:-5000}:5000'
    volumes:
      - ./osrm:/osrm

volumes:
  postgres-data:
  mosquitto-data:
  seaweedfs-data:
