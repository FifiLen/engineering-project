# Konfiguracja deweloperska. Na demo: uwierzytelnianie i TLS (zob. dokumentacja wdrożenia).
persistence true
persistence_location /mosquitto/data/
# Sesje trwałe (backend, hulajnogi) wznawiają się po restarcie; porzucone wygasają po dobie.
persistent_client_expiration 1d

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
